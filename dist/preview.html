function safeDecodeToken(raw) {
  if (!raw || typeof raw !== 'string') return '';
  try {
    return decodeURIComponent(raw).trim();
  } catch {
    return raw.trim();
  }
}
function parseMvcPortTokenFromCookieString(rawCookies) {
  if (!rawCookies || typeof rawCookies !== 'string') {
    return '';
  }
  let baseMatch = '';
  let suffixedMatch = '';
  for (const part of rawCookies.split(';')) {
    const trimmed = part.trim();
    const eqIdx = trimmed.indexOf('=');
    if (eqIdx <= 0) continue;
    const name = trimmed.slice(0, eqIdx).trim();
    const val = trimmed.slice(eqIdx + 1).trim();
    if (!val) continue;
    if (name === 'MVCPORT_TOKEN') {
      baseMatch = safeDecodeToken(val);
    } else if (name.indexOf('MVCPORT_TOKEN_') === 0) {
      suffixedMatch = safeDecodeToken(val);
    }
  }
  return suffixedMatch || baseMatch || '';
}
function extractMvcPortTokenFromText(text) {
  if (!text || typeof text !== 'string') {
    return '';
  }
  const mvcMatch = text.match(
    /https?:\\?\/\\?\/mvcport\.fpt\.net\\?\/[^"'<>\s]*?(?:[?&]|&amp;)Token=([^"'&<>\s#\\]+)/i
  );
  if (mvcMatch && mvcMatch[1]) {
    return safeDecodeToken(mvcMatch[1]);
  }
  const leftMenuMatch = text.match(
    /LeftMenu\.aspx[^"'<>\s]*?(?:[?&]|&amp;)mvct=([^"'&<>\s#\\]+)/i
  );
  if (leftMenuMatch && leftMenuMatch[1]) {
    return safeDecodeToken(leftMenuMatch[1]);
  }
  const mvctParamMatch = text.match(/(?:[?&]|&amp;)mvct=([^"'&<>\s#\\]+)/i);
  if (mvctParamMatch && mvctParamMatch[1]) {
    return safeDecodeToken(mvctParamMatch[1]);
  }
  return '';
}

function readTokenFromPortLocation(loc) {
  try {
    if (!loc) return '';
    const host = String(loc.hostname || '').toLowerCase();
    if (!host.endsWith('mvcport.fpt.net') && !host.endsWith('port.fpt.net')) {
      return '';
    }
    const rawSearch = String(loc.search || '');
    const tokenMatch = rawSearch.match(/[?&]Token=([^&#]+)/i);
    if (tokenMatch && tokenMatch[1]) {
      return safeDecodeToken(tokenMatch[1]);
    }
    if (host.endsWith('port.fpt.net')) {
      const mvctMatch = rawSearch.match(/[?&]mvct=([^&#]+)/i);
      if (mvctMatch && mvctMatch[1]) {
        return safeDecodeToken(mvctMatch[1]);
      }
    }
    return '';
  } catch {
    return '';
  }
}

function appendPortTokenToUrl(rawUrl, token) {
  if (!token) return rawUrl;
  try {
    const u = new URL(rawUrl);
    if (!/mvcport\.fpt\.net$/i.test(u.hostname) || u.searchParams.has('Token')) {
      return rawUrl;
    }
    u.searchParams.set('Token', token);
    return u.toString();
  } catch {
    return rawUrl;
  }
}

function collectPortCandidateWindows(entryWin) {
  if (!entryWin) return [];
  const roots = [entryWin];
  try {
    if (entryWin.top) roots.push(entryWin.top);
  } catch {
    // ignore cross-origin top access
  }
  try {
    if (typeof unsafeWindow !== 'undefined' && unsafeWindow && unsafeWindow.top) {
      roots.push(unsafeWindow.top);
    }
  } catch {
    // ignore cross-origin unsafeWindow top access
  }

  const visited = new Set();
  const list = [];
  for (const rootWin of roots) {
    const windowsToCheck = [rootWin];
    try {
      const frameCount = rootWin && rootWin.frames ? Math.min(rootWin.frames.length, 12) : 0;
      for (let i = 0; i < frameCount; i += 1) {
        windowsToCheck.push(rootWin.frames[i]);
      }
    } catch {
      // ignore cross-origin frame list
    }
    for (const candidateWin of windowsToCheck) {
      if (!candidateWin || visited.has(candidateWin)) continue;
      visited.add(candidateWin);
      list.push(candidateWin);
    }
  }
  return list;
}

function readTokenFromPortFrame(win) {
  try {
    if (!win || !win.location) return '';
    const host = String(win.location.hostname || '').toLowerCase();
    if (!host.endsWith('mvcport.fpt.net') && !host.endsWith('port.fpt.net')) {
      return '';
    }
    const locToken = readTokenFromPortLocation(win.location);
    if (locToken) return locToken;

    const doc = win.document;
    if (!doc) return '';

    const cookieToken = parseMvcPortTokenFromCookieString(
      typeof doc.cookie === 'string' ? doc.cookie : ''
    );
    if (cookieToken) return cookieToken;

    const frameEls = doc.querySelectorAll('frame[src], iframe[src]');
    for (const frameEl of frameEls) {
      const srcAttr = frameEl.getAttribute('src') || '';
      const extracted = extractMvcPortTokenFromText(srcAttr) || extractMvcPortTokenFromText(frameEl.src || '');
      if (extracted) return extracted;
      if (frameEl.src) {
        try {
          const parsedFrameUrl = new URL(frameEl.src);
          const locTok = readTokenFromPortLocation(parsedFrameUrl);
          if (locTok) return locTok;
        } catch {
          // ignore invalid frame URL
        }
      }
    }

    const candidates = doc.querySelectorAll(
      'a[href*="mvcport.fpt.net"], a[href*="Token="], [onclick*="mvcport.fpt.net"], [onclick*="Token="]'
    );
    for (const node of candidates) {
      const hrefAttr = node.getAttribute('href') || '';
      const onclickAttr = node.getAttribute('onclick') || '';
      const extracted =
        extractMvcPortTokenFromText(hrefAttr) ||
        extractMvcPortTokenFromText(onclickAttr) ||
        extractMvcPortTokenFromText(node.href || '');
      if (extracted) return extracted;
      if (node.href) {
        try {
          const u = new URL(node.href);
          if (u.hostname.toLowerCase().endsWith('mvcport.fpt.net')) {
            const qTok = readTokenFromPortLocation(u);
            if (qTok) return qTok;
          }
        } catch {
          // ignore invalid href URL
        }
      }
    }

    if (host.endsWith('port.fpt.net') && doc.documentElement) {

function getMvcPortTokenFromPage() {
  if (typeof window === 'undefined' || typeof document === 'undefined') {
    return '';
  }
  try {
    const host = (window.location && window.location.hostname ? window.location.hostname : '').toLowerCase();
    if (host === 'fpt.net' || host.endsWith('.fpt.net')) {
      const docToken = parseMvcPortTokenFromCookieString(
        typeof document.cookie === 'string' ? document.cookie : ''
      );
      if (docToken) {
        cachedMvcPortToken = docToken;
        return docToken;
      }
      try {
        if (typeof unsafeWindow !== 'undefined' && unsafeWindow && unsafeWindow.document) {
          const unsafeToken = parseMvcPortTokenFromCookieString(
            typeof unsafeWindow.document.cookie === 'string' ? unsafeWindow.document.cookie : ''
          );
          if (unsafeToken) {
            cachedMvcPortToken = unsafeToken;
            return unsafeToken;
          }
        }
      } catch {
        // ignore unsafeWindow cookie access errors
      }
    }

    const locToken = readTokenFromPortLocation(window.location);
    if (locToken) {
      cachedMvcPortToken = locToken;
      return locToken;
    }

    const candidateWins = collectPortCandidateWindows(window);
    for (const candidateWin of candidateWins) {
      const frameToken = readTokenFromPortFrame(candidateWin);
      if (frameToken) {
        cachedMvcPortToken = frameToken;
        return frameToken;
      }
    }

    return cachedMvcPortToken || '';
  } catch {
    return cachedMvcPortToken || '';
  }

async function bootstrapMvcPortSession() {
  if (!isUserscriptEnv()) {
    return { ok: false, reason: 'preview' };

  if (portBootstrapInFlight) {
    return portBootstrapInFlight;
  }

  portBootstrapInFlight = (async () => {
    async function fetchTokenFromPortIndex(allowWarmup = true) {
      const idxRes = await requestPortal({
        url: PORT_ENDPOINTS.portIndexPage,
        method: 'GET',
        timeout: 8000,
      });
      const idxFinalUrl = String((idxRes && idxRes.finalUrl) || '');
      const idxBody = String((idxRes && idxRes.responseText) || '');
      const redirectedToAuth =
        /\/LoginPage\.aspx(?:\?|$|#)/i.test(idxFinalUrl) ||
        /https?:\/\/[^/]*(?:iam|sso|login|auth|signin|oauth|cas)/i.test(idxFinalUrl) ||
        /<input[^>]+type\s*=\s*["']?password["']?/i.test(idxBody);
      if (!idxRes || !idxRes.ok || redirectedToAuth) {
        if (redirectedToAuth && allowWarmup && canWarmPortalSession()) {
          const warm = await warmPortalSession(PORTALS.port.url, { timeout: 12000 });
          if (warm && warm.ok) {
            return fetchTokenFromPortIndex(false);
          }
        }
        return '';
      }
      const extracted = extractMvcPortTokenFromText(idxBody);
      if (extracted) {
        cachedMvcPortToken = extracted;
        return extracted;
      }
      return '';
    }

    let token = getMvcPortTokenFromPage();
    let fetchedIndex = false;
    if (!token) {
      fetchedIndex = true;
      token = await fetchTokenFromPortIndex();
    }
    if (!token) {
      return { ok: false, reason: 'no_token' };
    }

    const warmUrl = appendPortTokenToUrl(PORT_ENDPOINTS.indexPage, token);
    const warmRes = await requestPortal({ url: warmUrl, method: 'GET', timeout: 10000 });
    if (warmRes && warmRes.ok && !detectPortSessionExpired(warmRes, warmUrl).expired) {
      return { ok: true, res: warmRes };
    }

    if (!fetchedIndex) {
      cachedMvcPortToken = '';
      const freshToken = await fetchTokenFromPortIndex();
      if (freshToken && freshToken !== token) {
        const warmUrl2 = appendPortTokenToUrl(PORT_ENDPOINTS.indexPage, freshToken);
        const warmRes2 = await requestPortal({ url: warmUrl2, method: 'GET', timeout: 10000 });
        if (warmRes2 && warmRes2.ok && !detectPortSessionExpired(warmRes2, warmUrl2).expired) {
          return { ok: true, res: warmRes2 };
        }
      }
    }

function triggerPortFtthMenuAction(win = typeof window !== 'undefined' ? window : null) {

function detectPortSessionExpired(res, requestedUrl) {
  const status = (res && res.status) || 0;
  const finalUrl = (res && res.finalUrl) || '';
  const body = (res && res.responseText) || '';

  const iam = detectIamRedirect({
    status,
    finalUrl,
    responseText: body,
    requestedUrl,
  });
  if (iam.expired) {
    return { expired: true, reason: iam.reason };
  }
  if (/LoginPage\.aspx/i.test(finalUrl)) {
    return {
      expired: true,
      reason: 'Phiên đăng nhập port.fpt.net đã chuyển về trang LoginPage.aspx.',
    };
  }
  const trimmedBody = body.trim();
  const looksHtmlPage = /<(?:!doctype|html|head|body|script|div|select|input|table)\b/i.test(trimmedBody);
  if (
    !looksHtmlPage &&
    trimmedBody.length < 500 &&
    /Hết thời gian làm việc|Vui lòng Refesh/i.test(trimmedBody)
  ) {
    return {
      expired: true,
      reason: 'Máy chủ Port báo hết thời gian làm việc (cần đăng nhập lại port.fpt.net).',
    };
  }
  return { expired: false, reason: '' };
}

async function portRequest({
  url,
  method = 'POST',
  data = null,
  headers = PORT_AJAX_HEADERS,
  timeout = 15000,
  _didBootstrap = false,
}) {
  const targetUrl = buildPortUrl(url);
  const res = await requestPortal({ url: targetUrl, method, data, headers, timeout });

  if (res.error === 'NETWORK_ERROR' || res.error === 'TIMEOUT' || res.status === 0) {
    return {
      ok: false,
      statusType: 'error',
      message: 'Không kết nối được tới mvcport.fpt.net. Hãy kiểm tra VPN công ty.',
      loginUrl: PORTALS.port.url,
      res,
    };
  }

  const expiredCheck = detectPortSessionExpired(res, targetUrl);
  if (expiredCheck.expired) {
    if (!_didBootstrap) {
      const boot = await bootstrapMvcPortSession();
      if (boot && boot.ok) {
        return portRequest({ url, method, data, headers, timeout, _didBootstrap: true });
      }
    }
    if (_didBootstrap) {
      cachedMvcPortToken = '';
    }
    let onLoggedInPortHost = false;
    try {
      if (typeof window !== 'undefined' && window.location) {
        const h = String(window.location.hostname || '').toLowerCase();
        const p = String(window.location.pathname || '');
        onLoggedInPortHost = h === 'port.fpt.net' && !/LoginPage\.aspx/i.test(p);
      }
    } catch {
      onLoggedInPortHost = false;
    }
    return {
      ok: false,
      statusType: 'iam_expired',
      message: onLoggedInPortHost
        ? 'Bạn đã đăng nhập port.fpt.net nhưng phiên FTTH NEW (mvcport.fpt.net) chưa được kích hoạt. Bấm nút "Kích hoạt FTTH NEW ngay" bên dưới hoặc chọn menu trái: FTTH NEW → Hợp đồng → Tìm kiếm 1 lần rồi bấm thử lại (không cần đăng nhập lại hay F5).'
        : 'Phiên đăng nhập Port (port.fpt.net) đã hết hạn hoặc chưa kích hoạt FTTH NEW. Bấm nút bên dưới để mở port.fpt.net đăng nhập rồi vào menu FTTH NEW → Hợp đồng → Tìm kiếm 1 lần (không cần F5).',
      loginUrl: PORTALS.port.url,
      res,
    };
  }

  if (!res.ok) {
    return {
      ok: false,
      statusType: 'error',
      message: `Máy chủ Port trả về mã HTTP ${res.status}.`,
      loginUrl: PORTALS.port.url,
      res,
    };
  }

  return { ok: true, res };
}

const DEFAULT_CONBOX_PARAM_SPECS = [
  { key: 'PopName', argIndex: 0 },
  { key: 'type', argIndex: 1 },
  { key: 'status', argIndex: 2 },
];

/**
 * Tu dong doc ten tham so POST cua Load_ConnectingBox_ByName_DeployCapacity trong /js/lib.js.
 */
function parseConboxParamsFromLibJs(jsText) {
  if (!jsText || typeof jsText !== 'string') {
    return DEFAULT_CONBOX_PARAM_SPECS;
  }
  const fnMatch = jsText.match(/function\s+Load_ConnectingBox_ByName_DeployCapacity\s*\(([^)]*)\)/i);
  if (!fnMatch || fnMatch.index === undefined) {
    return DEFAULT_CONBOX_PARAM_SPECS;
  }
  const formalParams = fnMatch[1]
    .split(',')
    .map((p) => p.trim())
    .filter(Boolean);

  const fnSlice = jsText.slice(fnMatch.index, fnMatch.index + 1600);
  if (!/Load_ConnectingBox_ByName_DeployCapacity/i.test(fnSlice)) {
    return DEFAULT_CONBOX_PARAM_SPECS;
  }
  const dataMatch = fnSlice.match(/\bdata\s*:\s*\{([^}]*)\}/i);
  if (!dataMatch) {
    return DEFAULT_CONBOX_PARAM_SPECS;
  }

  const specs = [];
  const entries = dataMatch[1].split(',');
  for (const entry of entries) {
    const colonIdx = entry.indexOf(':');
    if (colonIdx <= 0) continue;
    const key = entry.slice(0, colonIdx).replace(/['"\s]/g, '').trim();
    const rhs = entry.slice(colonIdx + 1).trim();
    if (!key) continue;

    let matchedArgIdx = -1;
    for (let i = 0; i < formalParams.length; i += 1) {
      const pName = formalParams[i];
      if (new RegExp(`\\b${escapeRegExp(pName)}\\b`).test(rhs)) {
        matchedArgIdx = i;
        break;
      }
    }
    if (matchedArgIdx >= 0) {
      specs.push({ key, argIndex: matchedArgIdx });
    } else if (/^['"]?[-.\w]+['"]?$/.test(rhs)) {
      specs.push({ key, argIndex: -1, literalValue: rhs.replace(/^['"]|['"]$/g, '') });
    }
  }

  return specs.length > 0 ? specs : DEFAULT_CONBOX_PARAM_SPECS;
}

/**

function parsePortOptionsFromHtml(rawResponse) {
  if (!rawResponse || typeof rawResponse !== 'string') {
    return [];
  }
  const maybeJson = safeJsonParse(rawResponse);
  const html = typeof maybeJson === 'string' ? maybeJson : rawResponse;

  const cleanHtml = html
    .replace(new RegExp('<script\\b[^>]*>[\\s\\S]*?</' + 'script>', 'gi'), ' ')
    .replace(new RegExp('<style\\b[^>]*>[\\s\\S]*?</' + 'style>', 'gi'), ' ');

  const slots = [];
  const seen = new Set();
  const inputRe = /<input\b([^>]*)>/gi;
  let im;

  while ((im = inputRe.exec(cleanHtml)) !== null) {
    const attrs = im[1] || '';
    const type = getHtmlAttr(attrs, 'type').toLowerCase();
    const id = getHtmlAttr(attrs, 'id');
    if (type !== 'radio' && id.toLowerCase() !== 'radport') {
      continue;
    }
    const portID = decodeHtmlEntities(getHtmlAttr(attrs, 'value')).trim();
    if (!portID || seen.has(portID)) {
      continue;
    }
    seen.add(portID);

    const disabled = /\bdisabled\b/i.test(attrs);
    const checked = /\bchecked\b/i.test(attrs);

    const tail = cleanHtml.slice(inputRe.lastIndex, inputRe.lastIndex + 160);
    const stopMatch = tail.match(/^([\s\S]*?)(?:<\/label>|<\/li>|<\/td>|<\/span>|<\/div>|<br\b|<input\b|$)/i);
    let portLabel = stripHtmlClean(stopMatch ? stopMatch[1] : '');

    if (!portLabel) {
      const before = cleanHtml.slice(Math.max(0, im.index - 120), im.index);
      const afterTag = before.replace(/^[\s\S]*<(?:label|li|td|span|div)[^>]*>/i, '');
      portLabel = stripHtmlClean(afterTag);
    }

    slots.push({
      portID,
      port: portLabel || portID,
      disabled,
      checked,
    });
  }

  return slots;
}

  return {
    status: 'ok',

    summaryFields,
  };

async function getConboxParamSpecs() {
  if (cachedConboxParamSpec.specs && Date.now() < cachedConboxParamSpec.expiresAt) {
    return cachedConboxParamSpec.specs;
  }
  try {
    const res = await requestPortal({
      url: buildPortUrl(PORT_ENDPOINTS.libJs),
      method: 'GET',
      headers: { Accept: 'application/javascript, text/javascript, */*' },
      timeout: 10000,
    });
    if (res && res.ok && res.responseText) {
      const specs = parseConboxParamsFromLibJs(res.responseText);
      cachedConboxParamSpec = { specs, expiresAt: Date.now() + META_TTL_MS };
      return specs;
    }
  } catch {
    // Su dung danh sach tham so mac dinh neu khong tai duoc lib.js
  }
  return DEFAULT_CONBOX_PARAM_SPECS;
}

/**
 * Tai day du thong tin Port hien tai cua hop dong tren mvcport.fpt.net (Index_Search + Insert/<ID> hoac LoadData).
 */
async function fetchPortContractContext(
  rawContractId,
  { typeContract = '3', forceRefresh = false, forceDemo = false } = {}
) {
  const check = validateContractId(rawContractId);
  if (!check.valid) {
    return { status: 'validation_error', message: check.error };
  }

  const contractId = check.value;
  const cacheKey = `${contractId}:${typeContract}`;
  if (!forceRefresh) {
    const cached = PORT_CONTRACT_CACHE.get(cacheKey);
    if (cached && Date.now() - cached.cachedAt < CONTRACT_TTL_MS) {
      return cached.payload;
    }
  }

  if (!isUserscriptEnv() || forceDemo) {
    const demo = makeDemoContext(contractId, typeContract);
    PORT_CONTRACT_CACHE.set(cacheKey, { cachedAt: Date.now(), payload: demo });
    return demo;
  }

  const locRes = await fetchPortLocations({ forceRefresh });
  if (locRes.status !== 'ok') {
    return { status: locRes.status, message: locRes.message, loginUrl: locRes.loginUrl };
  }
  const locations = locRes.locations || [];
  const defaultLocationId = (locations[0] && locations[0].value) || '0';

  const branchRes = await fetchPortBranches(defaultLocationId);
  if (branchRes.status !== 'ok') {
    return { status: branchRes.status, message: branchRes.message, loginUrl: branchRes.loginUrl };
  }
  const branches = branchRes.branches || [];
  const defaultBranchId = (branches[0] && branches[0].value) || '0';

  async function runIndexSearch(pLocation, pBranch) {
    const body = new URLSearchParams({
      typeSearch: '1',
      pLocation: String(pLocation || ''),
      pBranch: String(pBranch || '0'),
      pPOpID: '0',
      pConBoxId: '0',
      contract: contractId,
    }).toString();
    const resp = await portRequest({
      url: PORT_ENDPOINTS.search,
      method: 'POST',
      data: body,
    });
    if (!resp.ok) {
      return resp;
    }
    const parsed = safeJsonParse(resp.res.responseText);
    return { ok: true, rows: Array.isArray(parsed) ? parsed : [] };
  }

  let searchRes = await runIndexSearch(defaultLocationId, defaultBranchId);
  if (!searchRes.ok) {
    return { status: searchRes.statusType, message: searchRes.message, loginUrl: searchRes.loginUrl };
  }
  let rows = searchRes.rows;
  if (rows.length === 0 && defaultBranchId !== '0') {
    const retryRes = await runIndexSearch(defaultLocationId, '0');
    if (retryRes.ok && Array.isArray(retryRes.rows)) {
      rows = retryRes.rows;
    }
  }

  const exactRow =
    rows.find((r) => r && String(r.ContractName || '').trim().toUpperCase() === contractId) ||
    (rows.length === 1 ? rows[0] : null);

  if (exactRow && exactRow.ID) {
    const insertUrl = `${PORT_ENDPOINTS.insertPage}/${encodeURIComponent(String(exactRow.ID))}`;
    const detailResp = await portRequest({
      url: insertUrl,
      method: 'GET',
      headers: { Accept: 'text/html, */*' },
    });
    if (!detailResp.ok) {
      return {
        status: detailResp.statusType,
        message: detailResp.message,
        loginUrl: detailResp.loginUrl,
      };
    }

    const parsedDetail = parsePortContractDetailHtml(detailResp.res.responseText) || {};
    const detail = {
      ...parsedDetail,
      id: parsedDetail.id || String(exactRow.ID),
      contractName: parsedDetail.contractName || String(exactRow.ContractName || contractId),
      customer: parsedDetail.customer || decodeHtmlEntities(String(exactRow.CusName || '')),
      address: parsedDetail.address || decodeHtmlEntities(String(exactRow.Address || '')),
      cardNumber: parsedDetail.cardNumber || String(exactRow.CardNumber || ''),
      email: parsedDetail.email || String(exactRow.Email || ''),
      localType: parsedDetail.localType || String(exactRow.LocalType || ''),
    };

    const result = {
      status: 'ok',
      mode: 'live',
      recordMode: 'existing',
      sourceUrl: insertUrl,
      detail,
      locations,
      defaultLocationId,
      branches,
      defaultBranchId,
    };
    PORT_CONTRACT_CACHE.set(cacheKey, { cachedAt: Date.now(), payload: result });
    return result;
  }

  // Chua co tren Index_Search -> nap tu /FTTH_NewPort/Contract/LoadData de cap Port moi
  const loadBody = new URLSearchParams({
    ContractName: contractId,
    TypeContract: String(typeContract || '3'),
  }).toString();
  const loadResp = await portRequest({
    url: PORT_ENDPOINTS.loadData,
    method: 'POST',
    data: loadBody,
  });
  if (!loadResp.ok) {
    return {
      status: loadResp.statusType,
      message: loadResp.message,
      loginUrl: loadResp.loginUrl,
    };
  }

  const loadParsed = safeJsonParse(loadResp.res.responseText);
  if (Array.isArray(loadParsed) && loadParsed.length >= 10) {
    const detail = {
      id: '',
      contractName: contractId,
      typeContract: String(typeContract || '3'),
      typeContractLabel: String(typeContract) === '5' ? 'FTTH_NEW LeaseLine' : 'FTTH_New',
      status: '1',
      statusLabel: 'Chưa cấp Port (HĐ mới)',
      statusPort: '',
      statusPortLabel: '',
      releaseStatusPortValue: '2',
      reassignStatusPortValue: '3',
      customer: decodeHtmlEntities(String(loadParsed[0] || '')).trim(),
      company: decodeHtmlEntities(String(loadParsed[1] || '')).trim(),
      address: decodeHtmlEntities(String(loadParsed[2] || '')).trim(),
      email: decodeHtmlEntities(String(loadParsed[3] || '')).trim(),
      handphone: decodeHtmlEntities(String(loadParsed[4] || '')).trim(),
      telephone: decodeHtmlEntities(String(loadParsed[5] || '')).trim(),
      localType: decodeHtmlEntities(String(loadParsed[6] || '')).trim(),
      description: decodeHtmlEntities(String(loadParsed[7] || '')).trim(),
      cmnd: decodeHtmlEntities(String(loadParsed[8] || '')).trim(),
      cardNumber: '1',
      createBy: '',
      createDate: '',
      updateBy: '',
      updateDate: '',
      tstc: '',
      pc: '',
      typeContractOptions: [
        { value: '3', label: 'FTTH_New', selected: String(typeContract) !== '5' },
        { value: '5', label: 'FTTH_NEW LeaseLine', selected: String(typeContract) === '5' },
      ],
      statusOptions: [
        { value: '1', label: 'Bình thường', selected: true },
        { value: '6', label: 'Đã thu hồi port', selected: false },
      ],
      statusPortOptions: [],
    };
    const result = {
      status: 'ok',
      mode: 'live',
      recordMode: 'new',
      sourceUrl: PORT_ENDPOINTS.insertPage,
      detail,
      locations,
      defaultLocationId,
      branches,
      defaultBranchId,
    };
    PORT_CONTRACT_CACHE.set(cacheKey, { cachedAt: Date.now(), payload: result });
    return result;
  }

  const loadMsg = stripHtmlClean(
    typeof loadParsed === 'string'
      ? loadParsed
      : Array.isArray(loadParsed)
      ? loadParsed[0] || ''
      : loadResp.res.responseText || ''
  );

  return {
    status: 'ok',
    mode: 'live',
    recordMode: 'not_found',
    loadDataError:
      loadMsg ||
      `Không tìm thấy hợp đồng ${contractId} trên FTTH NEW (Tìm kiếm lẫn LoadData). Hãy thử đổi Loại HĐ (FTTH_New / LeaseLine).`,
    sourceUrl: PORT_ENDPOINTS.indexPage,
    detail: {
      id: '',
      contractName: contractId,
      typeContract: String(typeContract || '3'),
      typeContractLabel: String(typeContract) === '5' ? 'FTTH_NEW LeaseLine' : 'FTTH_New',
      status: '',
      statusLabel: 'Chưa có trên FTTH NEW',
      customer: '',
      address: '',
      cardNumber: '1',
      localType: '',
      tstc: '',
      pc: '',
      typeContractOptions: [
        { value: '3', label: 'FTTH_New', selected: String(typeContract) !== '5' },
        { value: '5', label: 'FTTH_NEW LeaseLine', selected: String(typeContract) === '5' },
      ],
    },
    locations,
    defaultLocationId,
    branches,
    defaultBranchId,
  };
}

  summaryFields.push({
    label: 'Trạng thái Port',
    value: d.statusLabel || (ctxRes.recordMode === 'new' ? 'Chưa cấp Port (HĐ mới)' : 'Không rõ'),

  if (d.cardNumber) summaryFields.push({ label: 'Số thẻ', value: d.cardNumber });
  if (d.localType) summaryFields.push({ label: 'LocalType', value: d.localType });

  return {

        : 'Đã lấy dữ liệu trực tiếp từ mvcport.fpt.net (FTTH NEW).',
    summaryFields,
    sourceUrl: ctxRes.sourceUrl,
    sourceLabel: 'Mở trang Port gốc',

/**
 * Thuc thi lenh nghiep vu tren port.fpt.net / mvcport.fpt.net.
 */
async function runPortAction(actionId, rawContractId, ctx = {}) {
  const check = validateContractId(rawContractId);
  if (!check.valid) {
    return {
      status: 'validation_error',
      message: check.error,
    };
  }

  const contractId = check.value;
  const portal = PORTALS.port;

  if (!portal.actions.some((a) => a.id === actionId)) {
    return {
      status: 'error',
      message: 'Thao tác không hợp lệ trên cổng này.',
    };
  }

  if (!isUserscriptEnv() || ctx.forceDemo) {
    await sleep(350);
    return buildPortMockResult(actionId, contractId, ctx);
  }

  if (actionId === 'lookup_port') {
    const ctxRes = await fetchPortContractContext(contractId, { forceRefresh: true });
    if (ctxRes.status !== 'ok') {
      return {
        status: ctxRes.status,
        message: ctxRes.message,
        loginUrl: ctxRes.loginUrl || portal.url,
      };
    }
    return buildLookupResult(ctxRes, contractId);
  }

  if (actionId === 'release_port') {
    let detail = ctx.detail || null;
    if (!detail || !detail.id) {
      const ctxRes = await fetchPortContractContext(contractId, { forceRefresh: true });
      if (ctxRes.status !== 'ok') {
        return {
          status: ctxRes.status,
          message: ctxRes.message,
          loginUrl: ctxRes.loginUrl || portal.url,
        };
      }
      if (ctxRes.recordMode !== 'existing' || !ctxRes.detail || !ctxRes.detail.id) {
        return {
          status: 'warn',
          title: `Không thể thu hồi Port cho ${contractId}`,
          message: `Hợp đồng ${contractId} hiện chưa có bản ghi Port trên FTTH NEW để thu hồi.`,
        };
      }
      detail = ctxRes.detail;
    }

    const body = new URLSearchParams({
      typeContract: String(detail.typeContract || '3'),
      customer: String(detail.customer || ''),
      address: String(detail.address || ''),
      cardNumber: String(ctx.cardNumber ?? detail.cardNumber ?? ''),
      email: String(detail.email || ''),
      status: '6',
      cmnd: String(detail.cmnd || ''),
      localType: String(detail.localType || ''),
      description: String(ctx.description ?? detail.description ?? ''),
      company: String(detail.company || ''),
      telephone: String(detail.telephone || ''),
      handphone: String(detail.handphone || ''),
      portID: '',
      port: '',
      deviceName: '',
      location: '',
      branch: '',
      id: String(detail.id),
      statusPort: String(ctx.statusPort || detail.releaseStatusPortValue || '2'),
    }).toString();

    const resp = await portRequest({
      url: PORT_ENDPOINTS.updateContract,
      method: 'POST',
      data: body,
    });
    if (!resp.ok) {
      return { status: resp.statusType, message: resp.message, loginUrl: resp.loginUrl };
    }
    clearPortContractCache(contractId);
    return parsePortMutationResponse(resp.res.responseText, 'Thu hồi Port', contractId);
  }

  if (actionId === 'assign_port') {
    const portID = String(ctx.portID || '').trim();
    const port = String(ctx.port || '').trim();
    const deviceName = String(ctx.deviceName || '').trim();
    const location = String(ctx.location || '').trim();
    const branch = String(ctx.branch || '').trim();
    if (!portID || !port || !deviceName || !location || !branch) {
      return {
        status: 'validation_error',
        message: 'Hãy chọn đủ Vùng, Chi nhánh, POP, Hộp đấu nối và Port còn trống trước khi xác nhận.',
      };
    }

    const d = ctx.detail || {};
    const typeContract = String(ctx.typeContract || d.typeContract || '3');
    const cardNumber = String(ctx.cardNumber ?? d.cardNumber ?? '1');
    const description = String(ctx.description ?? d.description ?? '');

    if (ctx.recordMode === 'existing' && d.id) {
      const body = new URLSearchParams({
        typeContract,
        customer: String(d.customer || ''),
        address: String(d.address || ''),
        cardNumber,
        email: String(d.email || ''),
        status: '1',
        cmnd: String(d.cmnd || ''),
        localType: String(d.localType || ''),
        description,
        company: String(d.company || ''),
        telephone: String(d.telephone || ''),
        handphone: String(d.handphone || ''),
        portID,
        port,
        deviceName,
        location,
        branch,
        id: String(d.id),
        statusPort: String(ctx.statusPort || d.reassignStatusPortValue || '3'),
      }).toString();

      const resp = await portRequest({
        url: PORT_ENDPOINTS.updateContract,
        method: 'POST',
        data: body,
      });
      if (!resp.ok) {
        return { status: resp.statusType, message: resp.message, loginUrl: resp.loginUrl };
      }
      clearPortContractCache(contractId);
      return parsePortMutationResponse(resp.res.responseText, 'Đổi / Cấp lại Port', contractId);
    }

    const body = new URLSearchParams({
      contractName: String(d.contractName || contractId),
      typeContract,
      customer: String(d.customer || ''),
      address: String(d.address || ''),
      cardNumber,
      email: String(d.email || ''),
      status: '1',
      cmnd: String(d.cmnd || ''),
      localType: String(d.localType || ''),
      description,
      company: String(d.company || ''),
      telephone: String(d.telephone || ''),
      handphone: String(d.handphone || ''),
      portID,
      port,
      location,
      branch,
      deviceName,
    }).toString();

    const resp = await portRequest({
      url: PORT_ENDPOINTS.insertContract,
      method: 'POST',
      data: body,
    });
    if (!resp.ok) {
      return { status: resp.statusType, message: resp.message, loginUrl: resp.loginUrl };
    }
    clearPortContractCache(contractId);
    return parsePortMutationResponse(resp.res.responseText, 'Cấp Port mới', contractId);
  }

  return {
    status: 'error',
    message: 'Thao tác Port không được hỗ trợ.',
  };
}

    '(?:Ngày tạo phiếu|Người tạo phiếu|Ngày cập nhật|Người cập nhật|Thông số thi công|$)';

function parseRecallEquipmentRow(trEl, rowIndex = 0) {

function parseRecallTicketFromDocument(doc, loc = null) {
  if (!doc) {
    return {
      onRecallTicketPage: false,
      contract: '',
      activeTicketTitle: '',
      tickets: [],
      activeTicket: null,
      items: [],
      stats: { totalItems: 0, importedCount: 0, editableCount: 0, pendingCount: 0 },
      hasEmptyNotice: false,
      canCreateTicket: false,
      canAddEquipment: false,
      canAddNote: false,
      openDialogTitle: '',
    };
  }

  const bodyText = getRecallElementText(doc.body);
  const hasEmptyNotice = /chưa có phiếu thu hồi/i.test(bodyText);
  let contract = '';
  const bannerMatch = bodyText.match(
    /DANH SÁCH PHIẾU THU HỒI\s*[-–:]\s*([A-Z0-9._-]{3,32})/i
  );
  if (bannerMatch && bannerMatch[1]) {
    contract = normalizeContractId(bannerMatch[1]);
  }
  if (!contract && doc.title) {
    const titleCandidate = normalizeContractId(doc.title);
    if (
      titleCandidate &&
      !RECALL_GENERIC_TITLES_RE.test(titleCandidate) &&
      validateContractId(titleCandidate).valid
    ) {
      contract = titleCandidate;
    }
  }

  const headings =
    typeof doc.querySelectorAll === 'function' ? Array.from(doc.querySelectorAll('h1,h2,h3,h4')) : [];
  const ticketHeading = headings.find((h) => /^phiếu số\s+\d+/i.test(getRecallElementText(h)));
  const activeTicketTitle = getRecallElementText(ticketHeading);

  const ticketCards =
    typeof doc.querySelectorAll === 'function' ? Array.from(doc.querySelectorAll('.ticketinf')) : [];
  const tickets = ticketCards
    .map((cardEl, idx) => parseRecallTicketCardElement(cardEl, idx))
    .filter(Boolean);

  let activeTicket = tickets.find((t) => t.isSelected) || null;
  if (!activeTicket && activeTicketTitle) {
    const numMatch = activeTicketTitle.match(/\d+/);
    if (numMatch) {
      activeTicket = tickets.find((t) => t.ticketNumber === numMatch[0]) || null;
    }
  }
  if (!activeTicket && tickets.length > 0) {
    activeTicket = tickets[0];
  }

  const gridRows = getRecallGridRows(doc);
  const items = gridRows.map((trEl, idx) => parseRecallEquipmentRow(trEl, idx)).filter(Boolean);

  const importedCount = items.filter((item) => /đã nhập kho/i.test(item.recallStatus)).length;
  const editableCount = items.filter((item) => item.canEdit).length;
  const pendingCount = items.length - importedCount;

    typeof doc.querySelector === 'function' ? doc.querySelector('.rz-dialog.rz-open') : null;
  const dialogTitleEl =
    openDialog && typeof openDialog.querySelector === 'function'
      ? openDialog.querySelector('.rz-dialog-title, .rz-dialog-titlebar')
      : null;
  const openDialogTitle = getRecallElementText(dialogTitleEl);

  return {
    onRecallTicketPage:
      isRecallTicketLocation(loc) ||
      hasEmptyNotice ||
      Boolean(bannerMatch) ||
      tickets.length > 0 ||
      items.length > 0 ||
      Boolean(activeTicketTitle),
    contract,
    activeTicketTitle,
    tickets,
    activeTicket,
    items,
    stats: {
      totalItems: items.length,
      importedCount,
      editableCount,
      pendingCount,
    },
    hasEmptyNotice,
    canCreateTicket: Boolean(findRecallCreateTicketButton(doc)),
    canAddEquipment: Boolean(findRecallAddEquipmentButton(doc)),
    canAddNote: Boolean(findRecallNoteControls(doc).input),

  };

function setRecallNativeInputValue(inputEl, value) {
  if (!inputEl) return;
  const strVal = String(value ?? '');
  try {
    const proto = typeof HTMLInputElement !== 'undefined' ? HTMLInputElement.prototype : null;
    const desc = proto ? Object.getOwnPropertyDescriptor(proto, 'value') : null;
    if (desc && typeof desc.set === 'function') {
      desc.set.call(inputEl, strVal);
    } else {
      inputEl.value = strVal;
    }
  } catch {
    inputEl.value = strVal;
  }

  if (typeof inputEl.dispatchEvent === 'function') {
    for (const evtName of ['input', 'change']) {
      try {
        if (typeof Event === 'function') {
          inputEl.dispatchEvent(new Event(evtName, { bubbles: true }));
        } else {
          inputEl.dispatchEvent({ type: evtName, bubbles: true });
        }
      } catch {
        // Ignore custom mock dispatch failures
      }
    }
  }
}

  if (button && typeof button.click === 'function') {
    button.click();
  } else if (typeof input.dispatchEvent === 'function') {
    try {
      if (typeof KeyboardEvent === 'function') {
        input.dispatchEvent(

  return { ok: true, contractId: check.value };

async function evalRecallDom(expr) {
  const boot = buildRecallPortalBootstrapJs();
  return evalAndroidPortalJs(`${boot}\nreturn (${expr});`);
}

function shouldUseLocalRecallDoc(ctx = {}) {
  const doc = ctx.pageDocument || null;
  const loc = ctx.pageLocation || (doc && doc.location) || null;
  return !canControlAndroidPortal() || Boolean(doc && loc && isRecallTicketLocation(loc));
}

async function callRecallStaffOp(op, payload = {}, ctx = {}) {
  if (shouldUseLocalRecallDoc(ctx)) {
    const doc = ctx.pageDocument || null;
    if (op === 'read_dialog') return readRecallStaffDialogState(doc);
    if (op === 'open_staff_dropdown') return triggerRecallOpenStaffDropdown(doc);
    if (op === 'filter_staff_dropdown') {
      return triggerRecallFilterStaffDropdown(doc, payload.query || '');
    }
    if (op === 'pick_staff_option') {
      return triggerRecallPickStaffOption(doc, payload.targetStaff || '');
    }
    if (op === 'submit_dialog') return triggerRecallSubmitEditDialog(doc);
    if (op === 'close_dialog') return triggerRecallCloseEditDialog(doc);
    return { ok: false, error: 'Thao tác KTV phiếu thu hồi không xác định.' };
  }

  const res = await evalRecallDom(
    `window.__riRecallDom.runStaffOp(${JSON.stringify(op)}, ${JSON.stringify(payload || {})})`
  );
  if (!res.ok || !res.value) {
    return {
      ok: false,
      error: res.error || 'Không kết nối được hộp thoại Sửa vật tư NextGen.',
    };
  }
  return res.value;
}

async function readRecallTicketSnapshotNow(ctx = {}) {
  if (shouldUseLocalRecallDoc(ctx)) {
    const doc = ctx.pageDocument || null;
    const loc = ctx.pageLocation || (doc && doc.location) || null;
    const snackEl =
      doc && typeof doc.querySelector === 'function'
        ? doc.querySelector('.mud-snackbar, .rz-notification-message, .rz-growl-message')
        : null;
    return {
      snapshot: doc ? parseRecallTicketFromDocument(doc, loc) : null,
      snackbarText: getRecallElementText(snackEl),
    };
  }
  const res = await evalRecallDom('window.__riRecallDom.inspectState()');
  if (res.ok && res.value) {
    return {
      snapshot: res.value.snapshot || null,
      snackbarText: res.value.snackbarText || '',
    };
  }
  return { snapshot: null, snackbarText: '' };
}

    await sleep(200);
    const cur = await callRecallStaffOp('read_dialog', {}, ctx);
    if (cur && cur.isOpen && cur.hasStaffField) {
      st = cur;
      break;
    }
  }

  if (!st || !st.isOpen || !st.hasStaffField) {
    return {
      status: 'error',
      mode: 'live',
      message: 'Không mở được hộp thoại Sửa vật tư hoặc không thấy ô "Nhân viên*" trên NextGen.',
    };
  }

  if (!st.staffDisabled) {
    await callRecallStaffOp('open_staff_dropdown', {}, ctx);
    const ddDeadline = Date.now() + 2200;
    while (Date.now() < ddDeadline) {
      await sleep(180);
      const nextSt = await callRecallStaffOp('read_dialog', {}, ctx);
      if (nextSt && nextSt.isOpen) {
        st = nextSt;
        if (nextSt.staffPanelOpen && Array.isArray(nextSt.staffOptions) && nextSt.staffOptions.length > 0) {
          break;
        }
      }
    }
  }

  return {
    status: 'ok',
    mode: 'live',
    dialog: st,
  };
}

/**
 * Loc danh sach KTV trong dropdown Nhan vien* theo tu khoa tim kiem.
 */
async function searchRecallStaffOptions(rawQuery = '', ctx = {}) {
  const query = cleanRecallText(rawQuery);
  if (!isUserscriptEnv() || ctx.forceDemo) {
    const qLower = query.toLowerCase();
    const options = qLower
      ? DEMO_RECALL_STAFF_LIST.filter((name) => name.toLowerCase().includes(qLower))
      : [...DEMO_RECALL_STAFF_LIST];
    return {
      status: 'ok',
      mode: 'demo',
      query,
      options,
      currentStaff: '',
    };
  }

  let st = await callRecallStaffOp('read_dialog', {}, ctx);
  if (!st || !st.isOpen) {
    return {
      status: 'dialog_closed',
      mode: 'live',
      message: 'Hộp thoại sửa vật tư trên NextGen đã đóng. Hãy bấm "Đổi KTV" lại.',
    };
  }

  const prevSig = Array.isArray(st.staffOptions) ? st.staffOptions.join('|') : '';
  if (!st.staffPanelOpen) {
    await callRecallStaffOp('open_staff_dropdown', {}, ctx);
    await sleep(200);
  }

  const filterRes = await callRecallStaffOp('filter_staff_dropdown', { query }, ctx);
  if (!filterRes.ok) {
    return {
      status: 'error',
      mode: 'live',
      message: filterRes.error || 'Không lọc được danh sách Nhân viên trên NextGen.',
    };
  }

  await sleep(350);
  const qLower = query.toLowerCase();
  const pollDeadline = Date.now() + 2200;
  while (Date.now() < pollDeadline) {
    const cur = await callRecallStaffOp('read_dialog', {}, ctx);
    if (!cur || !cur.isOpen) {
      return {
        status: 'dialog_closed',
        mode: 'live',
        message: 'Hộp thoại sửa vật tư trên NextGen đã đóng.',
      };
    }
    st = cur;
    const opts = Array.isArray(cur.staffOptions) ? cur.staffOptions : [];
    const curSig = opts.join('|');
    const allMatch =
      !qLower || (opts.length > 0 && opts.every((o) => o.toLowerCase().includes(qLower)));
    if (curSig !== prevSig || allMatch) {
      break;
    }
    await sleep(200);
  }

  return {
    status: 'ok',
    mode: 'live',
    query,
    options: Array.isArray(st.staffOptions) ? st.staffOptions : [],
    currentStaff: st.currentStaff || '',
  };
}

/**
 * Chon KTV muc tieu trong o Nhan vien* va bam nut Cap nhat tren NextGen.
 */
async function submitRecallStaffUpdate(
  { targetStaff = '', rowIndex = 0 } = {},
  ctx = {}
) {
  const cleanStaff = cleanRecallText(targetStaff);
  if (!cleanStaff) {
    return {
      status: 'validation_error',
      message: 'Vui lòng chọn tên KTV mới trước khi cập nhật.',
    };
  }

  if (!isUserscriptEnv() || ctx.forceDemo) {
    return {
      status: 'ok',
      mode: 'demo',
      rowIndex,
      staff: cleanStaff,
      message: `Đã cập nhật KTV ${cleanStaff} (mẫu mô phỏng).`,
      snapshot: null,
    };
  }

  let st = await callRecallStaffOp('read_dialog', {}, ctx);
  if (!st || !st.isOpen) {
    return {
      status: 'dialog_closed',
      mode: 'live',
      message: 'Hộp thoại sửa vật tư trên NextGen đã đóng. Hãy bấm "Đổi KTV" lại.',
    };
  }

  const targetLower = cleanStaff.toLowerCase();
  const currentOpts = Array.isArray(st.staffOptions) ? st.staffOptions : [];
  const hasVisibleMatch =
    st.staffPanelOpen &&
    currentOpts.some((o) => o.toLowerCase() === targetLower || o.toLowerCase().includes(targetLower));

  if (!hasVisibleMatch) {
    const sr = await searchRecallStaffOptions(cleanStaff, ctx);
    if (sr.status !== 'ok') {
      return sr;
    }
  }

  let pickRes = await callRecallStaffOp('pick_staff_option', { targetStaff: cleanStaff }, ctx);
  if (!pickRes.ok) {
    return {
      status: 'error',
      mode: 'live',
      message: pickRes.error || `Không chọn được KTV "${cleanStaff}".`,
      dialogStillOpen: true,
    };
  }

  const pickVerifyDeadline = Date.now() + 1000;
  let retriedPick = false;
  while (Date.now() < pickVerifyDeadline) {
    await sleep(220);
    const verifySt = await callRecallStaffOp('read_dialog', {}, ctx);
    if (!verifySt || !verifySt.isOpen) break;
    if (
      verifySt.currentStaff &&
      verifySt.currentStaff.toLowerCase().includes(targetLower)
    ) {
      break;
    }
    if (!retriedPick && verifySt.staffPanelOpen) {
      retriedPick = true;
      await callRecallStaffOp('pick_staff_option', { targetStaff: cleanStaff }, ctx);
    }
  }

  const subRes = await callRecallStaffOp('submit_dialog', {}, ctx);
  if (!subRes.ok) {
    return {
      status: 'error',
      mode: 'live',
      message: subRes.error || 'Không bấm được nút "Cập nhật" trên hộp thoại NextGen.',
      dialogStillOpen: true,
    };
  }

  const submitDeadline = Date.now() + 5000;
  while (Date.now() < submitDeadline) {
    await sleep(250);
    const nextSt = await callRecallStaffOp('read_dialog', {}, ctx);
    if (!nextSt || !nextSt.isOpen) {
      await sleep(350);
      const after = await readRecallTicketSnapshotNow(ctx);
      const snapshot = after && 'snapshot' in after ? after.snapshot : after;
      const snack = (after && after.snackbarText) || (nextSt && nextSt.snackbarText) || '';
      return {
        status: 'ok',
        mode: 'live',
        rowIndex,
        staff: cleanStaff,
        message: snack || `Đã cập nhật KTV ${cleanStaff} thành công!`,
        snapshot,
      };
    }
    const errList = Array.isArray(nextSt.validationErrors) ? nextSt.validationErrors : [];
    const snackErr =
      nextSt.snackbarText &&
      /vui lòng|bắt buộc|lỗi|không thể|thất bại|chưa chọn/i.test(nextSt.snackbarText)
        ? nextSt.snackbarText
        : '';
    if (errList.length > 0 || snackErr) {
      return {
        status: 'validation_error',
        mode: 'live',
        message: errList.join(' • ') || snackErr,
        dialogStillOpen: true,
      };
    }
    st = nextSt;
  }

  return {
    status: 'validation_error',
    mode: 'live',
    message:
      (st && st.snackbarText) ||
      'NextGen chưa đóng hộp thoại sau khi bấm Cập nhật (có thể thiếu trường bắt buộc như Nguyên nhân). Bấm "Mở hộp thoại NextGen gốc" để hoàn tất.',
    dialogStillOpen: true,
  };
}

/**
 * Dong hop thoai Sua vat tu dang mo tren NextGen.
 */
async function closeRecallStaffEditor(ctx = {}) {
  if (!isUserscriptEnv() || ctx.forceDemo) {
    return { ok: true, alreadyClosed: true };
  }
  return callRecallStaffOp('close_dialog', {}, ctx);
}
async function triggerRecallPortalAction(actionType, payload = {}, doc = null) {
  const useLocalDoc =
    !canControlAndroidPortal() ||
    Boolean(doc && doc.location && isRecallTicketLocation(doc.location));

  if (useLocalDoc) {
    if (actionType === 'create_ticket') return triggerRecallCreateTicket(doc);
    if (actionType === 'select_ticket') {
      return triggerRecallSelectTicket(doc, payload.ticketIndex || 0);
    }
    if (actionType === 'add_equipment') return triggerRecallAddEquipment(doc);
    if (actionType === 'edit_equipment') {
      return triggerRecallEditEquipment(doc, payload.rowIndex || 0);
    }
    if (actionType === 'add_accessory') {
      return triggerRecallAddAccessory(doc, payload.rowIndex || 0);
    }
    if (actionType === 'submit_note') {
      return triggerRecallSubmitNote(doc, payload.note || '');
    }
    return { ok: false, error: 'Thao tác phiếu thu hồi không xác định.' };
  }

  const res = await evalRecallDom(
    `window.__riRecallDom.runAction(${JSON.stringify(actionType)}, ${JSON.stringify(payload || {})})`
  );
  if (!res.ok || !res.value) {
    return {
      ok: false,
      error: res.error || 'Không gửi được thao tác vào trang Phiếu thu hồi NextGen.',
    };
  }
  return res.value;
}

async function loadRecallTicketViaAndroidPortal(
  requestedContract,
  { onProgress = null, forceReload = false } = {}
) {
  const notify = (msg) => {
    if (typeof onProgress === 'function' && msg) {
      onProgress(msg);
    }
  };

  if (!forceReload) {
    const curCheck = await evalRecallDom('window.__riRecallDom.inspectState()');
    if (
      curCheck.ok &&
      curCheck.value &&
      !curCheck.value.sessionExpired &&
      curCheck.value.onTicket &&
      curCheck.value.snapshot
    ) {
      const curSnap = curCheck.value.snapshot;
      if (!requestedContract || !curSnap.contract || curSnap.contract === requestedContract) {
        return {
          status: 'ok',
          mode: 'live',
          snapshot: curSnap,
          requestedContract,
          contractMismatch: false,
        };
      }
    }
  }

  if (!requestedContract) {
    return {
      status: 'needs_contract_android',
      mode: 'live',
      contract: '',
      url: RECALL_ENDPOINTS.base,
      message:
        'Vui lòng nhập Mã hợp đồng ở màn hình chính trước khi mở Phiếu thu hồi vật tư.',
    };
  }

  notify('Đang kết nối cổng Thu hồi vật tư NextGen…');
  let didFoxBootstrap = false;
  let bgRes = await loadAndroidPortalBackground(RECALL_ENDPOINTS.base, {
    timeout: 18000,
  });
  if (!bgRes.ok && bgRes.status === 'needs_login') {
    notify('Đang đồng bộ phiên IAM cho cổng Vật tư…');
    const warmRes = await warmPortalSession(RECALL_ENDPOINTS.base, {
      timeout: 12000,
      force: true,
    });
    if (warmRes.ok) {
      bgRes = await loadAndroidPortalBackground(RECALL_ENDPOINTS.base, {
        timeout: 18000,
      });
    }
  }
  if (!bgRes.ok && bgRes.status === 'needs_login') {
    didFoxBootstrap = true;
    bgRes = await bootstrapNextGenViaFoxErpAndroid('recall', {
      onProgress: notify,
    });
  }

  if (!bgRes.ok) {
    if (bgRes.status === 'needs_login') {
      return {
        status: 'iam_expired',
        mode: 'live',
        contract: requestedContract,
        loginUrl: bgRes.loginUrl || FOX_ERP_HOME_URL,
        message:
          'Phiên đăng nhập IAM trên Fox-ERP / Vật tư NextGen đã hết hạn. Bấm "Đăng nhập IAM" bên dưới rồi thử lại.',
      };
    }
    return {
      status: 'error',
      mode: 'live',
      contract: requestedContract,
      message: 'Không kết nối được cổng Thu hồi vật tư NextGen (kiểm tra VPN / mạng nội bộ).',
    };
  }

  notify(`Đang tìm phiếu thu hồi HĐ ${requestedContract}…`);
  let openedMobileMenu = false;
  let searchSent = false;
  let searchDeadline = Date.now() + 8000;

  while (Date.now() < searchDeadline) {
    const stRes = await evalRecallDom('window.__riRecallDom.inspectState()');
    if (stRes.status === 'needs_login') {
      return {
        status: 'iam_expired',
        mode: 'live',
        contract: requestedContract,
        loginUrl: FOX_ERP_HOME_URL,
        message:
          'Phiên đăng nhập IAM trên NextGen Vật tư đã hết hạn. Bấm "Đăng nhập IAM" bên dưới rồi thử lại.',
      };
    }
    if (stRes.ok && stRes.value && stRes.value.sessionExpired) {
      if (didFoxBootstrap) {
        return {
          status: 'iam_expired',
          mode: 'live',
          contract: requestedContract,
          loginUrl: FOX_ERP_HOME_URL,
          message:
            'Phiên Thu hồi vật tư NextGen báo hết hạn. Bấm "Đăng nhập IAM" trên Fox-ERP rồi thử lại.',
        };
      }
      didFoxBootstrap = true;
      const foxRes = await bootstrapNextGenViaFoxErpAndroid('recall', {
        onProgress: notify,
      });
      if (!foxRes.ok) {
        return {
          status: foxRes.status === 'needs_login' ? 'iam_expired' : 'error',
          mode: 'live',
          contract: requestedContract,
          loginUrl: foxRes.loginUrl || FOX_ERP_HOME_URL,
          message:
            foxRes.error ||
            'Phiên Thu hồi vật tư NextGen đã hết hạn. Bấm "Đăng nhập IAM" trên Fox-ERP rồi thử lại.',
        };
      }
      openedMobileMenu = false;
      searchDeadline = Date.now() + 8000;
      continue;
    }
    if (stRes.ok && stRes.value) {
      const v = stRes.value;
      if (v.onTicket && v.snapshot && (!v.snapshot.contract || v.snapshot.contract === requestedContract)) {
        return {
          status: 'ok',
          mode: 'live',
          snapshot: v.snapshot,
          requestedContract,
          contractMismatch: false,
        };
      }
      if (!v.hasVisibleSearchInput && v.hasMenuToggle && !openedMobileMenu) {
        openedMobileMenu = true;
        await evalRecallDom('window.__riRecallDom.openMobileMenu()');
        await sleep(320);
        continue;
      }
      if (v.hasVisibleSearchInput || (openedMobileMenu && v.hasAnySearchInput)) {
        const sCall = await evalRecallDom(
          `window.__riRecallDom.searchContract(${JSON.stringify(requestedContract)})`
        );
        if (sCall.ok && sCall.value && sCall.value.ok) {
          searchSent = true;
          break;
        }
      }
    }
    await sleep(280);
  }

  if (!searchSent) {
    return {
      status: 'error',
      mode: 'live',
      contract: requestedContract,
      message: 'Chưa thấy ô "Nhập số hợp đồng" trên cổng Thu hồi vật tư. Bấm Thử lại sau vài giây.',
    };
  }

  notify(`Đang mở chi tiết phiếu thu hồi HĐ ${requestedContract}…`);
  const ticketDeadline = Date.now() + 14000;
  while (Date.now() < ticketDeadline) {
    await sleep(350);
    const stRes = await evalRecallDom('window.__riRecallDom.inspectState()');
    if (!stRes.ok || !stRes.value) continue;
    const v = stRes.value;
    if (
      v.onTicket &&
      v.snapshot &&
      (v.snapshot.contract ||
        v.snapshot.hasEmptyNotice ||
        v.snapshot.tickets.length > 0 ||
        v.snapshot.items.length > 0)
    ) {
      await sleep(250);
      const freshSnapRes = await evalRecallDom('window.__riRecallDom.readSnapshot()');
      const finalSnap =
        (freshSnapRes.ok && freshSnapRes.value) || v.snapshot;
      if (!finalSnap.contract) {
        finalSnap.contract = requestedContract;
      }
      return {
        status: 'ok',
        mode: 'live',
        snapshot: finalSnap,
        requestedContract,
        contractMismatch: false,
      };
    }
    if (
      !v.onTicket &&
      v.snackbarText &&
      /không tìm thấy|không tồn tại|không có hợp đồng|không hợp lệ/i.test(v.snackbarText)
    ) {
      return {
        status: 'error',
        mode: 'live',
        contract: requestedContract,
        message: v.snackbarText,
      };
    }
  }

  return {
    status: 'error',
    mode: 'live',
    contract: requestedContract,
    message: `Chưa nhận được phản hồi chi tiết phiếu thu hồi cho HĐ ${requestedContract}. Kiểm tra lại Mã HĐ rồi bấm Thử lại.`,
  };
}
async function loadRecallTicketContext(rawContractId, ctx = {}) {
  const requestedContract = normalizeContractId(rawContractId || '');
  if (!isUserscriptEnv() || ctx.forceDemo) {
    return {
      status: 'ok',
      mode: 'demo',
      snapshot: buildDemoRecallSnapshot(requestedContract || 'SGN123456'),
      requestedContract,
      contractMismatch: false,
    };
  }

  const loc = ctx.pageLocation || null;
  const doc = ctx.pageDocument || null;

  if ((!isRecallPortalLocation(loc) || !doc) && canControlAndroidPortal()) {
    return loadRecallTicketViaAndroidPortal(requestedContract, {
      onProgress: ctx.onProgress || null,
      forceReload: Boolean(ctx.forceReload),
    });
  }

  if (isRecallPortalLocation(loc) && doc && isNextGenSessionExpiredDocument(doc)) {
    return {
      status: 'nextgen_session_expired',
      mode: 'live',
      contract: requestedContract,
      foxErpUrl: FOX_ERP_HOME_URL,
      message:
        'Phiên Thu hồi vật tư (NextGen) đã hết hạn. Bấm "Cấp lại phiên qua Fox-ERP" bên dưới để mở lại đúng luồng.',
    };
  }

  if (isRecallTicketLocation(loc) && doc) {
    const snapshot = parseRecallTicketFromDocument(doc, loc);
    const contractMismatch = Boolean(
      requestedContract && snapshot.contract && requestedContract !== snapshot.contract
    );
    return {
      status: 'ok',
      mode: 'live',
      snapshot,
      requestedContract,
      contractMismatch,
    };
  }

  if (isRecallPortalLocation(loc)) {
    return {
      status: 'on_search_page',
      mode: 'live',
      contract: requestedContract,
      url: RECALL_ENDPOINTS.base,
      message:
        'Bạn đang ở trang chủ Thu hồi vật tư. Bấm nút bên dưới để tự điền Mã HĐ và mở chi tiết phiếu thu hồi.',
    };
  }

  return {
    status: 'needs_recall_page',
    mode: 'live',
    contract: requestedContract,
    url: RECALL_ENDPOINTS.base,
    message:
      'Thu hồi vật tư chạy trên Blazor Server (nextgen.fpt.net/resource/recall). Bấm nút bên dưới để mở trang Thu hồi và tự động tìm Mã HĐ.',
  };
}
async function runRecallAction(actionId, rawContractId, ctx = {}) {
  const rawTrimmed = String(rawContractId || '').trim();
  if (rawTrimmed) {
    const check = validateContractId(rawTrimmed);
    if (!check.valid) {
      return {
        status: 'validation_error',
        message: check.error,
      };
    }
  }

  if (actionId !== 'lookup_recall' && actionId !== 'manage_recall') {
    return {
      status: 'error',
      message: 'Thao tác không hợp lệ trên cổng Vật tư thu hồi.',
    };
  }

  const res = await loadRecallTicketContext(rawTrimmed, ctx);
  if (res.status === 'ok') {
    const snap = res.snapshot;
    const ticket = snap.activeTicket || {};
    const contractLabel = snap.contract || normalizeContractId(rawTrimmed) || 'Phiếu đang mở';
    const hasNoTickets = snap.tickets.length === 0 && snap.items.length === 0;

    if (hasNoTickets) {
      return {
        status: 'ok',
        mode: res.mode,
        title: `Vật tư thu hồi — ${contractLabel}`,
        message: `Hợp đồng ${contractLabel} hiện chưa có phiếu thu hồi trên hệ thống NextGen.`,
        summaryFields: [
          { label: 'Mã hợp đồng', value: contractLabel },
          { label: 'Trạng thái phiếu', value: 'Chưa có phiếu thu hồi' },
        ],
        snapshot: snap,
      };
    }

    const summaryFields = [
      { label: 'Mã hợp đồng', value: contractLabel },
      { label: 'Phiếu đang chọn', value: snap.activeTicketTitle || `Phiếu số ${ticket.ticketNumber || '1'}` },
      ticket.unit ? { label: 'Đơn vị', value: ticket.unit } : null,
      ticket.constructionSpec ? { label: 'Thông số thi công', value: ticket.constructionSpec } : null,
      {
        label: 'Tổng vật tư thu hồi',
        value: `${snap.stats.totalItems} mục (${snap.stats.importedCount} đã nhập kho, ${snap.stats.editableCount} sửa được)`,
      },
      ticket.updatedAt || ticket.updatedBy
        ? {
            label: 'Cập nhật gần nhất',
            value: [ticket.updatedAt, ticket.updatedBy].filter(Boolean).join(' • '),
          }
        : null,
    ].filter(Boolean);

    return {
      status: 'ok',
      mode: res.mode,
      title: `Vật tư thu hồi — ${contractLabel}`,
      message: `Phiếu số ${ticket.ticketNumber || '1'}: ${snap.stats.totalItems} vật tư (${snap.stats.importedCount} đã nhập kho, ${snap.stats.editableCount} sửa được).`,
      summaryFields,
      snapshot: snap,
    };
  }

  if (res.status === 'nextgen_session_expired') {
    return {
      status: 'iam_expired',
      mode: res.mode || 'live',
      title: 'Phiên NextGen Vật tư đã hết hạn',
      message:
        res.message ||
        'Phiên Thu hồi vật tư (NextGen) đã hết hạn. Hãy mở lại qua Fox-ERP rồi thử lại.',
      loginUrl: res.foxErpUrl || FOX_ERP_HOME_URL,
    };
  }

  if (res.status === 'iam_expired') {
    return {
      status: 'iam_expired',
      mode: res.mode || 'live',
      title: 'Cần đăng nhập IAM cổng Vật tư',
      message:
        res.message ||
        'Phiên đăng nhập IAM trên NextGen Vật tư đã hết hạn. Hãy bấm Đăng nhập IAM rồi thử lại.',
      loginUrl: res.loginUrl || RECALL_ENDPOINTS.base,
    };
  }

  if (res.status === 'error' || res.status === 'needs_contract_android') {
    return {
      status: res.status === 'needs_contract_android' ? 'validation_error' : 'error',
      mode: res.mode || 'live',
      title: 'Không đọc được Phiếu thu hồi',
      message: res.message || 'Lỗi kết nối cổng Thu hồi vật tư NextGen.',
    };
  }

  return {
    status: 'needs_scan',
    mode: res.mode || 'live',
    title: res.status === 'on_search_page' ? 'Đang ở trang tìm kiếm Thu hồi' : 'Cần mở trang Chi tiết thu hồi',
    message: res.message,

async function selectEquipmentFilterOption(

  }

    if (waitNextKind) {

      if (existingNext.options.length === 0) {

        while (Date.now() < waitAlreadyPopulatingDeadline) {

          existingNext = readEquipmentFilterOptions(doc, waitNextKind);
          if (existingNext.options.length > 0) {

          }
        }
      }
      if (existingNext.options.length > 0) {

    }

    await sleep(200);
  }

  if (typeof dd.click === 'function') {
    dd.click();
    await sleep(180);
  }

  let panel = findEquipmentFilterDropdownAndPanel(doc, fieldKind).panel || initialPanel;
  let items =
    panel && typeof panel.querySelectorAll === 'function'
      ? Array.from(panel.querySelectorAll('.rz-dropdown-item, .rz-multiselect-item'))
      : [];
  if (items.length === 0) {
    const waitItemsDeadline = Date.now() + 2500;
    while (Date.now() < waitItemsDeadline) {
      await sleep(150);
      panel = findEquipmentFilterDropdownAndPanel(doc, fieldKind).panel || initialPanel;
      items =
        panel && typeof panel.querySelectorAll === 'function'
          ? Array.from(panel.querySelectorAll('.rz-dropdown-item, .rz-multiselect-item'))
          : [];
      if (items.length > 0) {
        break;
      }

  }

  let match = items.find((el) => normalizeEquipmentMatchKey(getEquipmentElText(el)) === targetNorm);
  if (!match) {
    match = items.find((el) => normalizeEquipmentMatchKey(getEquipmentElText(el)).includes(targetNorm));
  }
  if (!match || typeof match.click !== 'function') {
    return { ok: false, error: `Không tìm thấy mục "${targetText}" trong danh sách "${fieldKind}".` };
  }

  const picked = getEquipmentElText(match);
  match.click();
  await sleep(150);

  // Neu Radzen multi-select popup van mo sau khi chon, dong gon lai
  try {

      await sleep(100);

  } catch {

  }

  if (waitNextKind) {
    const deadline = Date.now() + waitTimeoutMs;
    while (Date.now() < deadline) {
      await sleep(150);
      const nextOpts = readEquipmentFilterOptions(doc, waitNextKind);
      if (nextOpts.options.length > 0) {

function parseEquipmentDebtPagerInfo(scopeEl) {
  const fallback = { currentPage: 1, totalPages: 1, totalItems: 0, rawText: '' };
  if (!scopeEl || typeof scopeEl.querySelector !== 'function') return fallback;
  const summaryEl = scopeEl.querySelector('.rz-pager-summary');

  if (enMatch) {
    return {

      totalPages: Math.max(1, Number(enMatch[2]) || 1),
      totalItems: Number(enMatch[3]) || 0,

    };
  }

  const viMatch = rawText.match(/Trang\s+(\d+)\s*(?:\/|trên|của)\s*(\d+)/i);
  if (viMatch) {

function parseEquipmentDebtColumns(tableEl) {
  if (!tableEl || typeof tableEl.querySelectorAll !== 'function') {
    return { staffColIndex: 0, materials: [] };
  }
  const theadRows = Array.from(tableEl.querySelectorAll('thead tr'));
  if (theadRows.length === 0) {
    return { staffColIndex: 0, materials: [] };
  }

  let staffColIndex = 0;
  const materials = [];

  if (theadRows.length >= 2) {
    const topCells = Array.from(theadRows[0].querySelectorAll('th, td'));
    const groupBySubIdx = [];
    let leadingFixedCount = 0;

    for (let idx = 0; idx < topCells.length; idx += 1) {
      const cell = topCells[idx];
      const text = getEquipmentElText(cell);
      const rSpan = Math.max(1, Number(cell.rowSpan || (cell.getAttribute && cell.getAttribute('rowspan')) || 1));
      const cSpan = Math.max(1, Number(cell.colSpan || (cell.getAttribute && cell.getAttribute('colspan')) || 1));

      if (/^nhân viên$/i.test(text) || rSpan >= 2) {
        if (/^nhân viên$/i.test(text)) {
          staffColIndex = leadingFixedCount;
        }
        leadingFixedCount += cSpan;
        continue;
      }

      for (let k = 0; k < cSpan; k += 1) {
        groupBySubIdx.push(text || 'Khác');
      }
    }

    const subCells = Array.from(theadRows[1].querySelectorAll('th, td'));
    for (let i = 0; i < subCells.length; i += 1) {
      const colIndex = i + leadingFixedCount;
      const matName = getEquipmentElText(subCells[i]) || `Vật tư #${colIndex}`;
      materials.push({
        key: `col_${colIndex}`,
        colIndex,
        group: groupBySubIdx[i] || 'Khác',
        name: matName,
      });
    }

    return { staffColIndex, materials };
  }

  const singleCells = Array.from(theadRows[0].querySelectorAll('th, td'));
  for (let i = 0; i < singleCells.length; i += 1) {
    const text = getEquipmentElText(singleCells[i]);
    if (i === 0 || /^nhân viên$/i.test(text)) {
      if (/^nhân viên$/i.test(text)) staffColIndex = i;
      continue;
    }
    materials.push({
      key: `col_${i}`,
      colIndex: i,
      group: 'Vật tư',
      name: text || `Vật tư #${i}`,
    });
  }

  return { staffColIndex, materials };
}
function parseEquipmentDebtPageRows(tableEl, columnsInfo) {
  if (!tableEl || typeof tableEl.querySelectorAll !== 'function') return [];
  const staffIdx = columnsInfo && Number.isFinite(columnsInfo.staffColIndex)
    ? columnsInfo.staffColIndex
    : 0;
  const materials = (columnsInfo && Array.isArray(columnsInfo.materials) && columnsInfo.materials) || [];
  const trList = getEquipmentRealBodyRows(tableEl);
  const parsed = [];

  for (const tr of trList) {
    if (!tr || typeof tr.querySelectorAll !== 'function') continue;
    const cells = Array.from(tr.querySelectorAll('td, th'));
    if (cells.length < 2) continue;
    const staff = getEquipmentElText(cells[staffIdx]);
    if (!staff) continue;

    const stocks = {};
    for (const mat of materials) {
      const cell = cells[mat.colIndex];
      if (!cell) continue;
      const qty = parseEquipmentDebtNumber(getEquipmentElText(cell));
      if (qty > 0) {
        stocks[mat.key] = qty;
      }
    }
    parsed.push({ staff, stocks });
  }

  return parsed;
}
function buildEquipmentDebtDataset(materials = [], rowsInput = [], meta = {}) {
  const rowMap = new Map();
  for (const r of rowsInput) {
    if (!r || !r.staff) continue;
    rowMap.set(r.staff, {
      staff: r.staff,
      stocks: r.stocks && typeof r.stocks === 'object' ? { ...r.stocks } : {},
    });
  }
  const rows = Array.from(rowMap.values());

  const matTotals = new Map();
  const matCounts = new Map();
  for (const row of rows) {
    for (const [key, val] of Object.entries(row.stocks)) {
      const qty = Number(val || 0);
      if (qty > 0) {
        matTotals.set(key, (matTotals.get(key) || 0) + qty);
        matCounts.set(key, (matCounts.get(key) || 0) + 1);
      }
    }
  }

  const enrichedMaterials = materials.map((mat) => ({
    ...mat,
    totalQty: matTotals.get(mat.key) || 0,
    holderCount: matCounts.get(mat.key) || 0,
  }));

  const groupMap = new Map();
  for (const mat of enrichedMaterials) {
    const gName = mat.group || 'Khác';
    if (!groupMap.has(gName)) {
      groupMap.set(gName, { name: gName, materialCount: 0, activeMaterialCount: 0 });
    }
    const gObj = groupMap.get(gName);
    gObj.materialCount += 1;
    if (mat.holderCount > 0) {
      gObj.activeMaterialCount += 1;
    }
  }

  return {
    materials: enrichedMaterials,
    groups: Array.from(groupMap.values()),
    rows,
    totalStaff: rows.length,
    totalMaterials: enrichedMaterials.length,
    activeMaterials: enrichedMaterials.filter((m) => m.holderCount > 0).length,
    meta,
  };
}
function queryEquipmentDebtHolders(

  materialKey,
  { sortBy = 'qty_desc', staffSearch = '' } = {}
) {
  if (!dataset || !materialKey) {
    return { material: null, holders: [], totalQty: 0, holderCount: 0 };
  }
  const material = (dataset.materials || []).find((m) => m.key === materialKey) || null;
  const q = cleanEquipmentText(staffSearch).toLowerCase();
  const holders = [];
  let totalQty = 0;

  for (const row of dataset.rows || []) {
    const qty = Number((row.stocks && row.stocks[materialKey]) || 0);
    if (!(qty > 0)) continue;
    totalQty += qty;
    if (q && !row.staff.toLowerCase().includes(q)) continue;
    holders.push({ staff: row.staff, qty });
  }

  if (sortBy === 'name_asc') {
    holders.sort((a, b) => a.staff.localeCompare(b.staff));
  } else {
    holders.sort((a, b) => b.qty - a.qty || a.staff.localeCompare(b.staff));
  }

  return {
    material,
    holders,
    totalQty,
    holderCount: holders.length,
  };
}
function queryEquipmentDebtByStaff(dataset, staffName) {

    totalQty += qty;
    items.push({
      key: mat.key,
      group: mat.group || 'Khác',
      name: mat.name,
      qty,
    });
  }
  items.sort((a, b) => b.qty - a.qty || a.name.localeCompare(b.name));

    items,
    totalQty,
    itemCount: items.length,
  };
}

    rows[0] && typeof rows[0].querySelector === 'function'
      ? rows[0].querySelector('td, th')
      : null;
  const lastRow = rows.length > 0 ? rows[rows.length - 1] : null;
  const lastCell =
    lastRow && typeof lastRow.querySelector === 'function'
      ? lastRow.querySelector('td, th')
      : null;
  return {
    currentPage: pager.currentPage,
    totalPages: pager.totalPages,
    totalItems: pager.totalItems,
    rowCount: rows.length,
    firstStaff: getEquipmentElText(firstCell),
    lastStaff: getEquipmentElText(lastCell),
  };
}

async function waitForEquipmentPageContentChange(
  grid,
  prevState,
  { mode = 'page', targetPageSize = 0, timeoutMs = 5500 } = {}
) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    await sleep(150);
    const next = readEquipmentGridSnapshotState(grid);
    if (next.rowCount === 0) continue;

    // Bo qua trang thai tam cua Radzen Blazor khi dang nap lai ("Page 1 of 1 (1 items)")
    const isTransientSummary =
      prevState.totalItems > 1 && next.totalItems > 0 && next.totalItems < prevState.totalItems;
    if (isTransientSummary) continue;

    if (mode === 'pagesize') {
      const expectedRows =
        targetPageSize > 0 && prevState.totalItems > 0
          ? Math.min(targetPageSize, prevState.totalItems)
          : 0;
      const pageSizeChanged =
        expectedRows > prevState.rowCount
          ? next.rowCount >= expectedRows
          : prevState.rowCount === 0
          ? next.rowCount !== prevState.rowCount
          : next.rowCount > prevState.rowCount;
      if (pageSizeChanged) {
        await sleep(220);
        return true;
      }
      continue;
    }

    const contentChanged =
      next.firstStaff !== prevState.firstStaff ||
      next.lastStaff !== prevState.lastStaff ||
      next.rowCount !== prevState.rowCount;
    if (contentChanged) {
      await sleep(180);
      return true;
    }
  }
  return false;
}
async function collectEquipmentDebtFromDocument(
  doc,
  { onProgress = null, maxPages = 30, waitMs = 5500 } = {}
) {
  const ctrls = findEquipmentDebtPageControls(doc);
  const grid = ctrls.grid;
  if (!grid) {
    return {
      status: 'needs_report_loaded',
      hasDebtTab: ctrls.hasDebtTab,
      isDebtTabActive: ctrls.isDebtTabActive,
      hasViewListBtn: Boolean(ctrls.viewListBtn),
      hasReportMenuBtn: Boolean(findEquipmentReportMenuBtn(doc)),
      filterMissing: readEquipmentFilterState(doc).missingRequired,
      message:
        'Chưa thấy bảng "Tồn công nợ theo NV" trên trang. Hãy vào Báo cáo → Báo cáo nợ → Xem danh sách.',
    };
  }

  let table = findEquipmentTableInGrid(grid);
  let pagerInfo = parseEquipmentDebtPagerInfo(grid);

  // Step A: Tang page size len muc lon nhat (thuong la 100/trang) de giam so trang can quet
  if (pagerInfo.totalPages > 1 && typeof grid.querySelector === 'function') {
    const pagerEl = grid.querySelector('.rz-pager');
    const dd = pagerEl && typeof pagerEl.querySelector === 'function'
      ? pagerEl.querySelector('.rz-dropdown')
      : null;
    if (dd) {
      const currentSize = parseEquipmentDebtNumber(getEquipmentElText(dd));
      const ddId = dd.id || '';
      let panel = null;
      if (ddId && typeof doc.getElementById === 'function') {
        panel = doc.getElementById(`popup-${ddId}`) || doc.getElementById(`popup${ddId}`);
      }
      if (!panel && typeof doc.querySelectorAll === 'function') {
        panel =
          Array.from(doc.querySelectorAll('.rz-dropdown-panel')).find((p) => {
            const items = Array.from(p.querySelectorAll('.rz-dropdown-item')).map((x) =>
              getEquipmentElText(x)
            );
            return items.includes('100') || items.includes('50') || items.includes('25');
          }) || null;
      }

      if (panel && typeof panel.querySelectorAll === 'function') {
        const numericItems = Array.from(panel.querySelectorAll('.rz-dropdown-item'))
          .map((item) => ({
            el: item,
            size: parseEquipmentDebtNumber(getEquipmentElText(item)),
          }))
          .filter((x) => x.size > 0);
        numericItems.sort((a, b) => b.size - a.size);
        const best = numericItems[0];
        if (best && best.size > currentSize && typeof best.el.click === 'function') {
          const prevSnap = readEquipmentGridSnapshotState(grid);
          if (typeof dd.click === 'function') {
            dd.click();
            await sleep(80);
          }
          best.el.click();
          await waitForEquipmentPageContentChange(grid, prevSnap, {
            mode: 'pagesize',
            targetPageSize: best.size,
            timeoutMs: Math.max(waitMs, 6500),
          });
          pagerInfo = parseEquipmentDebtPagerInfo(grid);
        }
      }
    }
  }

  // Step B: Neu dang khong o trang 1, quay ve trang 1 truoc khi quet
  if (pagerInfo.currentPage > 1 && typeof grid.querySelector === 'function') {
    const pagerEl = grid.querySelector('.rz-pager');
    const firstBtn =
      pagerEl && typeof pagerEl.querySelector === 'function'
        ? pagerEl.querySelector('.rz-pager-first')
        : null;
    if (firstBtn && !isEquipmentPagerDisabled(firstBtn) && typeof firstBtn.click === 'function') {
      const prevSnap = readEquipmentGridSnapshotState(grid);
      firstBtn.click();
      await waitForEquipmentPageContentChange(grid, prevSnap, {
        mode: 'page',
        timeoutMs: waitMs,
      });
      pagerInfo = parseEquipmentDebtPagerInfo(grid);
    }
  }

  // Step C: Duyet qua toan bo cac trang va gop danh sach KTV
  let columnsInfo = null;
  const staffMap = new Map();
  let pagesScanned = 0;

  for (let step = 0; step < maxPages; step += 1) {
    table = findEquipmentTableInGrid(grid);
    pagerInfo = parseEquipmentDebtPagerInfo(grid);
    if (!table) break;

    if (!columnsInfo) {
      columnsInfo = parseEquipmentDebtColumns(table);
    }
    const pageRows = parseEquipmentDebtPageRows(table, columnsInfo);
    for (const row of pageRows) {
      staffMap.set(row.staff, row);
    }
    pagesScanned += 1;

    if (typeof onProgress === 'function') {
      onProgress({
        currentPage: pagerInfo.currentPage,
        totalPages: pagerInfo.totalPages,
        collectedStaff: staffMap.size,
        totalItems: pagerInfo.totalItems,
      });
    }

    if (pagerInfo.currentPage >= pagerInfo.totalPages) {
      break;
    }

    const pagerEl = typeof grid.querySelector === 'function' ? grid.querySelector('.rz-pager') : null;
    const nextBtn =
      pagerEl && typeof pagerEl.querySelector === 'function'
        ? pagerEl.querySelector('.rz-pager-next')
        : null;
    if (!nextBtn || isEquipmentPagerDisabled(nextBtn) || typeof nextBtn.click !== 'function') {
      break;
    }

    const prevSnap = readEquipmentGridSnapshotState(grid);
    nextBtn.click();
    const changed = await waitForEquipmentPageContentChange(grid, prevSnap, {
      mode: 'page',
      timeoutMs: waitMs,
    });
    if (!changed) {
      break;
    }
  }

  const finalMaterials = (columnsInfo && columnsInfo.materials) || [];
  const dataset = buildEquipmentDebtDataset(finalMaterials, Array.from(staffMap.values()), {
    pagesScanned,
    totalPages: pagerInfo.totalPages,
    expectedItems: pagerInfo.totalItems,
  });

  return {
    status: 'ok',
    mode: 'live',
    dataset,
  };
}

  if (canControlAndroidPortal()) {
