async function selectAndroidEquipmentFilterOption(
  fieldKind,
  targetText,
  { waitNextKind = '', waitTimeoutMs = 5000 } = {}
) {
  const targetNorm = normalizeEquipmentMatchKey(targetText);
  if (!targetNorm) {
    return { ok: false, error: 'Giá trị bộ lọc cần chọn đang trống.' };
  }

  const curRes = await evalEquipDom(
    `window.__riEquipDom.readFilterOptions(${JSON.stringify(fieldKind)})`
  );
  const curText = (curRes.ok && curRes.value && curRes.value.current) || '';

  if (curText && normalizeEquipmentMatchKey(curText) === targetNorm) {
    if (!waitNextKind) {
      return { ok: true, skipped: true, picked: curText };
    }
    const checkNextDeadline = Date.now() + 1200;
    while (Date.now() < checkNextDeadline) {
      const nextRes = await evalEquipDom(
        `window.__riEquipDom.readFilterOptions(${JSON.stringify(waitNextKind)})`
      );
      if (nextRes.ok && nextRes.value && Array.isArray(nextRes.value.options) && nextRes.value.options.length > 0) {
        return { ok: true, skipped: true, picked: curText };
      }
      await sleep(160);
    }
  }

  const openRes = await evalEquipDom(
    `window.__riEquipDom.openFilterDropdown(${JSON.stringify(fieldKind)}, true)`
  );
  if (!openRes.ok || !openRes.value || !openRes.value.ok) {
    return {
      ok: false,
      error: (openRes.value && openRes.value.error) || `Không mở được danh sách chọn "${fieldKind}".`,
    };
  }
  await sleep(180);

  let picked = '';
  const pickDeadline = Date.now() + 3000;
  while (Date.now() < pickDeadline) {
    const pRes = await evalEquipDom(
      `window.__riEquipDom.pickFilterDropdownItem(${JSON.stringify(fieldKind)}, ${JSON.stringify(
        targetText
      )})`
    );
    if (pRes.ok && pRes.value) {
      if (pRes.value.ok) {
        picked = pRes.value.picked || targetText;
        break;
      }
      if (pRes.value.notFound && pRes.value.itemCount > 0) {
        return {
          ok: false,
          error: `Không tìm thấy mục "${targetText}" trong danh sách "${fieldKind}".`,
        };
      }
    }
    await sleep(160);
  }
  if (!picked) {
    return {
      ok: false,
      error: `Không tìm thấy mục "${targetText}" trong danh sách "${fieldKind}".`,
    };
  }

  if (waitNextKind) {
    const nextDeadline = Date.now() + waitTimeoutMs;
    while (Date.now() < nextDeadline) {
      await sleep(180);
      const nextRes = await evalEquipDom(
        `window.__riEquipDom.readFilterOptions(${JSON.stringify(waitNextKind)})`
      );
      if (nextRes.ok && nextRes.value && Array.isArray(nextRes.value.options) && nextRes.value.options.length > 0) {
        await sleep(150);
        break;
      }
    }
  }

  return { ok: true, picked };
}

async function waitForAndroidEquipmentGridChange(
  prevSnap,
  { mode = 'page', targetPageSize = 0, timeoutMs = 6500 } = {}
) {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    await sleep(180);
    const stRes = await evalEquipDom('window.__riEquipDom.inspectState()');
    const next = stRes.ok && stRes.value ? stRes.value.gridSnap : null;
    if (!next || next.rowCount === 0) continue;

    const isTransientSummary =
      prevSnap.totalItems > 1 && next.totalItems > 0 && next.totalItems < prevSnap.totalItems;
    if (isTransientSummary) continue;

    if (mode === 'pagesize') {
      const expectedRows =
        targetPageSize > 0 && prevSnap.totalItems > 0
          ? Math.min(targetPageSize, prevSnap.totalItems)
          : 0;
      const pageSizeChanged =
        expectedRows > prevSnap.rowCount
          ? next.rowCount >= expectedRows
          : prevSnap.rowCount === 0
          ? next.rowCount !== prevSnap.rowCount
          : next.rowCount > prevSnap.rowCount;
      if (pageSizeChanged) {
        await sleep(220);
        return true;
      }
      continue;
    }

    const contentChanged =
      next.firstStaff !== prevSnap.firstStaff ||
      next.lastStaff !== prevSnap.lastStaff ||
      next.rowCount !== prevSnap.rowCount;
    if (contentChanged) {
      await sleep(180);
      return true;
    }
  }
  return false;
}

async function loadEquipmentDebtViaAndroidPortal({
  activeFilter,
  forceApplyFilter = false,
  onProgress = null,
  maxPages = 30,
  waitMs = 6500,
} = {}) {
  const notifyStatus = (text) => {
    if (typeof onProgress === 'function') {
      onProgress({ phaseText: text });
    }
  };

  notifyStatus('Đang kết nối Quản lý vật tư NextGen…');
  let didFoxBootstrap = false;
  let bgRes = await loadAndroidPortalBackground(EQUIPMENT_ENDPOINTS.base, {
    reusePrefix: 'https://nextgen.fpt.net/resource/equipment',
    timeout: 18000,
  });
  if (!bgRes.ok && bgRes.status === 'needs_login') {
    notifyStatus('Đang đồng bộ phiên IAM cho Quản lý vật tư…');
    const warmRes = await warmPortalSession(EQUIPMENT_ENDPOINTS.base, {
      timeout: 12000,
      force: true,
    });
    if (warmRes.ok) {
      bgRes = await loadAndroidPortalBackground(EQUIPMENT_ENDPOINTS.base, {
        reusePrefix: 'https://nextgen.fpt.net/resource/equipment',
        timeout: 18000,
      });
    }
  }
  if (!bgRes.ok && bgRes.status === 'needs_login') {
    didFoxBootstrap = true;
    bgRes = await bootstrapNextGenViaFoxErpAndroid('equipment', {
      onProgress: notifyStatus,
    });
  }
  if (!bgRes.ok) {
    if (bgRes.status === 'needs_login') {
      return {
        status: 'iam_expired',
        mode: 'live',
        loginUrl: bgRes.loginUrl || FOX_ERP_HOME_URL,
        message:
          'Phiên đăng nhập IAM trên Fox-ERP / Quản lý vật tư đã hết hạn. Bấm "Đăng nhập IAM" bên dưới rồi thử lại.',
      };
    }
    return {
      status: 'error',
      mode: 'live',
      message: 'Không kết nối được Quản lý vật tư NextGen (kiểm tra VPN / mạng nội bộ).',
    };
  }

  let st = null;
  let readyDeadline = Date.now() + 8500;
  while (Date.now() < readyDeadline) {
    const r = await evalEquipDom('window.__riEquipDom.inspectState()');
    if (r.status === 'needs_login') {
      return {
        status: 'iam_expired',
        mode: 'live',
        loginUrl: FOX_ERP_HOME_URL,
        message:
          'Phiên đăng nhập IAM trên Quản lý vật tư đã hết hạn. Bấm "Đăng nhập IAM" bên dưới rồi thử lại.',
      };
    }
    if (r.ok && r.value && r.value.sessionExpired) {
      if (didFoxBootstrap) {
        return {
          status: 'iam_expired',
          mode: 'live',
          loginUrl: FOX_ERP_HOME_URL,
          message:
            'Phiên Quản lý vật tư NextGen báo hết hạn. Hãy bấm "Đăng nhập IAM" trên Fox-ERP rồi thử lại.',
        };
      }
      didFoxBootstrap = true;
      const foxRes = await bootstrapNextGenViaFoxErpAndroid('equipment', {
        onProgress: notifyStatus,
      });
      if (!foxRes.ok) {
        return {
          status: foxRes.status === 'needs_login' ? 'iam_expired' : 'error',
          mode: 'live',
          loginUrl: foxRes.loginUrl || FOX_ERP_HOME_URL,
          message:
            foxRes.error ||
            'Phiên Quản lý vật tư NextGen đã hết hạn. Bấm "Đăng nhập IAM" trên Fox-ERP rồi thử lại.',
        };
      }
      readyDeadline = Date.now() + 8500;
      continue;
    }
    if (r.ok && r.value && (r.value.hasDebtTab || r.value.hasReportMenuBtn)) {
      st = r.value;
      break;
    }
    await sleep(280);
  }
  if (!st) {
    return {
      status: 'error',
      mode: 'live',
      message: 'Trang Quản lý vật tư chưa tải xong menu Blazor. Bấm Thử lại sau vài giây.',
    };
  }

  if (!st.hasDebtTab) {
    notifyStatus('Đang tự mở Báo cáo → Báo cáo nợ…');
    const mBtn = await evalEquipDom('window.__riEquipDom.clickReportMenuBtn()');
    if (!mBtn.ok || !mBtn.value || !mBtn.value.ok) {
      return {
        status: 'error',
        mode: 'live',
        message: 'Không tìm thấy menu "Báo cáo" trên Quản lý vật tư.',
      };
    }
    let clickedDebtItem = false;
    const menuDeadline = Date.now() + 2500;
    while (Date.now() < menuDeadline) {
      await sleep(220);
      const dItem = await evalEquipDom('window.__riEquipDom.clickDebtReportItem()');
      if (dItem.ok && dItem.value && dItem.value.ok) {
        clickedDebtItem = true;
        break;
      }
    }
    if (!clickedDebtItem) {
      return {
        status: 'error',
        mode: 'live',
        message: 'Không mở được mục "Báo cáo nợ" trong menu Báo cáo.',
      };
    }

    const tabOpenDeadline = Date.now() + 6500;
    while (Date.now() < tabOpenDeadline) {
      await sleep(250);
      const r = await evalEquipDom('window.__riEquipDom.inspectState()');
      if (r.ok && r.value && r.value.hasDebtTab) {
        st = r.value;
        break;
      }
    }
  }

  if (!st.hasDebtTab) {
    return {
      status: 'error',
      mode: 'live',
      message: 'Chưa mở được trang Báo cáo nợ trên NextGen.',
    };
  }

  if (!st.isDebtTabActive) {
    notifyStatus('Đang chuyển sang tab Tồn công nợ theo NV…');
    await evalEquipDom('window.__riEquipDom.clickDebtTab()');
    await sleep(700);
    const r = await evalEquipDom('window.__riEquipDom.inspectState()');
    if (r.ok && r.value) st = r.value;
  }

  const filterToUse = activeFilter || getEffectiveEquipmentDebtFilter();
  if (forceApplyFilter || st.realRowCount === 0 || st.materialCount === 0) {
    const fs = st.filterState || {};
    if (forceApplyFilter || fs.missingRequired) {
      notifyStatus('Đang chọn Vùng cố định…');
      const r1 = await selectAndroidEquipmentFilterOption('region', filterToUse.region, {
        waitNextKind: 'province',
      });
      if (!r1.ok) {
        return {
          status: 'needs_report_loaded',
          mode: 'live',
          hasDebtTab: true,
          isDebtTabActive: true,
          hasViewListBtn: true,
          filterMissing: true,
          message: `${r1.error} Hãy chọn lại bộ lọc cố định bên dưới.`,
        };
      }

      notifyStatus('Đang chọn Tỉnh thành cố định…');
      const r2 = await selectAndroidEquipmentFilterOption('province', filterToUse.province, {
        waitNextKind: 'partner',
      });
      if (!r2.ok) {
        return {
          status: 'needs_report_loaded',
          mode: 'live',
          hasDebtTab: true,
          isDebtTabActive: true,
          hasViewListBtn: true,
          filterMissing: true,
          message: `${r2.error} Hãy chọn lại bộ lọc cố định bên dưới.`,
        };
      }

      notifyStatus('Đang chọn Đối tác cố định…');
      const r3 = await selectAndroidEquipmentFilterOption('partner', filterToUse.partner);
      if (!r3.ok) {
        return {
          status: 'needs_report_loaded',
          mode: 'live',
          hasDebtTab: true,
          isDebtTabActive: true,
          hasViewListBtn: true,
          filterMissing: true,
          message: `${r3.error} Hãy chọn lại bộ lọc cố định bên dưới.`,
        };
      }
    }

    notifyStatus('Đang bấm "Xem danh sách" & chờ bảng tải…');
    await evalEquipDom('window.__riEquipDom.clickViewList()');
    let loaded = false;
    const loadDeadline = Date.now() + 22000;
    while (Date.now() < loadDeadline) {
      await sleep(350);
      const r = await evalEquipDom('window.__riEquipDom.inspectState()');
      if (r.ok && r.value && r.value.realRowCount > 0 && r.value.materialCount > 0) {
        st = r.value;
        loaded = true;
        await sleep(200);
        break;
      }
    }
    if (!loaded) {
      return {
        status: 'needs_report_loaded',
        mode: 'live',
        hasDebtTab: true,
        isDebtTabActive: true,
        hasViewListBtn: true,
        filterMissing: false,
        message:
          'Đã bấm "Xem danh sách" nhưng bảng chưa trả dữ liệu kịp. Bấm Đọc lại dữ liệu để thử tiếp.',
      };
    }
  }

  if (st.gridSnap && st.gridSnap.totalPages > 1) {
    const bumpRes = await evalEquipDom('window.__riEquipDom.bumpMaxPageSize()');
    if (bumpRes.ok && bumpRes.value && bumpRes.value.changed && bumpRes.value.prevSnap) {
      notifyStatus('Đang mở rộng 100 KTV/trang để gom nhanh…');
      await waitForAndroidEquipmentGridChange(bumpRes.value.prevSnap, {
        mode: 'pagesize',
        targetPageSize: bumpRes.value.targetSize || 100,
        timeoutMs: Math.max(waitMs, 6500),
      });
    }
  }

  const postBump = await evalEquipDom('window.__riEquipDom.inspectState()');
  if (postBump.ok && postBump.value && postBump.value.gridSnap && postBump.value.gridSnap.currentPage > 1) {
    const firstRes = await evalEquipDom('window.__riEquipDom.clickFirstPage()');
    if (firstRes.ok && firstRes.value && firstRes.value.ok && firstRes.value.prevSnap) {
      await waitForAndroidEquipmentGridChange(firstRes.value.prevSnap, {
        mode: 'page',
        timeoutMs: waitMs,
      });
    }
  }

  let columnsInfo = null;
  let lastPager = { currentPage: 1, totalPages: 1, totalItems: 0 };
  const staffMap = new Map();
  let pagesScanned = 0;

  for (let step = 0; step < maxPages; step += 1) {
    const pageRes = await evalEquipDom(
      `window.__riEquipDom.readCurrentPage(${columnsInfo ? 'false' : 'true'})`
    );
    if (!pageRes.ok || !pageRes.value) break;
    const { pagerInfo, columnsInfo: cols, pageRows } = pageRes.value;
    if (!columnsInfo && cols) {
      columnsInfo = cols;
    }
    if (pagerInfo) {
      lastPager = pagerInfo;
    }
    for (const row of pageRows || []) {
      if (row && row.staff) {
        staffMap.set(row.staff, row);
      }
    }
    pagesScanned += 1;

    if (typeof onProgress === 'function') {
      onProgress({
        currentPage: lastPager.currentPage,
        totalPages: lastPager.totalPages,
        collectedStaff: staffMap.size,
        totalItems: lastPager.totalItems,
      });
    }

    if (lastPager.currentPage >= lastPager.totalPages) {
      break;
    }

    const nextClick = await evalEquipDom('window.__riEquipDom.clickNextPage()');
    if (!nextClick.ok || !nextClick.value || !nextClick.value.ok || !nextClick.value.prevSnap) {
      break;
    }
    const changed = await waitForAndroidEquipmentGridChange(nextClick.value.prevSnap, {
      mode: 'page',
      timeoutMs: waitMs,
    });
    if (!changed) {
      break;
    }
  }

  const finalInspect = await evalEquipDom('window.__riEquipDom.inspectState()');
  const fsEnd = (finalInspect.ok && finalInspect.value && finalInspect.value.filterState) || {};
  const currentFilter = {
    region: fsEnd.region || filterToUse.region,
    province: fsEnd.province || filterToUse.province,
    partner: fsEnd.partner || filterToUse.partner,
  };

  const finalMaterials = (columnsInfo && columnsInfo.materials) || [];
  const dataset = buildEquipmentDebtDataset(finalMaterials, Array.from(staffMap.values()), {
    pagesScanned,
    totalPages: lastPager.totalPages,
    expectedItems: lastPager.totalItems,
  });

  return {
    status: 'ok',
    mode: 'live',
    dataset,
    currentFilter,
  };
}
async function tryLoadEquipmentDebtViaDesktopBridge(ctx = {}) {
  const storageAdapter = ctx.storageAdapter || null;
  const hasGmBridge =
    typeof GM_getValue === 'function' && typeof GM_setValue === 'function';
  if (!storageAdapter && !hasGmBridge) {
    return null;
  }

  const reqId = `eqb_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  const activeFilter = ctx.activeFilter || getEffectiveEquipmentDebtFilter(storageAdapter);
  setState(STORAGE_KEYS.EQUIP_BRIDGE_RES, null, storageAdapter);
  setState(
    STORAGE_KEYS.EQUIP_BRIDGE_REQ,
    {
      reqId,
      activeFilter,
      forceApplyFilter: Boolean(ctx.forceApplyFilter),
      ts: Date.now(),
    },
    storageAdapter
  );

  const ackTimeoutMs = Math.max(400, Number(ctx.bridgeAckMs) || 1600);
  const fullTimeoutMs = Math.max(ackTimeoutMs + 1000, Number(ctx.bridgeTimeoutMs) || 32000);
  const startedAt = Date.now();
  let acked = false;

  while (true) {
    const elapsed = Date.now() - startedAt;
    if (!acked && elapsed > ackTimeoutMs) {
      setState(STORAGE_KEYS.EQUIP_BRIDGE_REQ, null, storageAdapter);
      return null;
    }
    if (elapsed > fullTimeoutMs) {
      setState(STORAGE_KEYS.EQUIP_BRIDGE_REQ, null, storageAdapter);
      return null;
    }

    await sleep(180);
    const res = getState(STORAGE_KEYS.EQUIP_BRIDGE_RES, null, storageAdapter);
    if (!res || typeof res !== 'object' || res.reqId !== reqId) {
      continue;
    }

    acked = true;
    if (res.status === 'working') {
      if (typeof ctx.onProgress === 'function' && res.progress) {
        ctx.onProgress(res.progress);
      }
      continue;
    }

    setState(STORAGE_KEYS.EQUIP_BRIDGE_REQ, null, storageAdapter);
    setState(STORAGE_KEYS.EQUIP_BRIDGE_RES, null, storageAdapter);

    if (res.status === 'ok' && res.dataset) {
      return {
        status: 'ok',
        mode: 'live',
        dataset: res.dataset,
        currentFilter: res.currentFilter || activeFilter,
        viaBridge: true,
      };
    }

    if (res.status === 'nextgen_session_expired') {
      return {
        status: 'nextgen_session_expired',
        mode: 'live',
        foxErpUrl: FOX_ERP_HOME_URL,
        message:
          res.message ||
          'Tab Quản lý vật tư đang mở đã hết phiên NextGen. Bấm nút bên dưới để cấp lại phiên qua Fox-ERP.',
      };
    }

    return null;
  }
}
async function handleEquipmentDebtDesktopBridgeRequest(
  doc,
  req,
  { storageAdapter = null } = {}
) {
  if (!doc || !req || !req.reqId) return false;
  const writeRes = (payload) =>
    setState(STORAGE_KEYS.EQUIP_BRIDGE_RES, { reqId: req.reqId, ...payload }, storageAdapter);

  if (isNextGenSessionExpiredDocument(doc)) {
    writeRes({
      status: 'nextgen_session_expired',
      message: 'Tab Quản lý vật tư đang mở đã hết phiên NextGen.',
    });
    return false;
  }

  const filterToUse = req.activeFilter || getEffectiveEquipmentDebtFilter(storageAdapter);
  writeRes({
    status: 'working',
    progress: { phaseText: 'Đang đọc trên tab Quản lý vật tư đang mở…' },
  });

  try {
    let ctrls = findEquipmentDebtPageControls(doc);
    if (!ctrls.hasDebtTab && findEquipmentReportMenuBtn(doc)) {
      writeRes({ status: 'working', progress: { phaseText: 'Đang tự mở Báo cáo → Báo cáo nợ…' } });
      const mRes = await triggerEquipmentOpenDebtReportMenu(doc);
      if (mRes.ok) {
        await waitForEquipmentDebtTabOpen(doc, { timeoutMs: 4500 });
        ctrls = findEquipmentDebtPageControls(doc);
      }
    }

    if (ctrls.hasDebtTab && !ctrls.isDebtTabActive) {
      writeRes({ status: 'working', progress: { phaseText: 'Đang chuyển tab Tồn công nợ theo NV…' } });
      triggerEquipmentDebtTab(doc);
      await sleep(700);
      ctrls = findEquipmentDebtPageControls(doc);
    }

    const table = ctrls.grid ? findEquipmentTableInGrid(ctrls.grid) : null;
    const realRows = getEquipmentRealBodyRows(table);
    const cols = table ? parseEquipmentDebtColumns(table) : { materials: [] };
    const filterState = readEquipmentFilterState(doc);

    if (
      req.forceApplyFilter ||
      realRows.length === 0 ||
      cols.materials.length === 0
    ) {
      if (req.forceApplyFilter || filterState.missingRequired) {
        const aRes = await applyEquipmentDebtFilterToPage(doc, filterToUse, {
          onProgress: (m) => writeRes({ status: 'working', progress: { phaseText: m } }),
        });
        if (!aRes.ok) {
          writeRes({ status: 'error', message: aRes.error });
          return false;
        }
      }
      if (ctrls.viewListBtn) {
        writeRes({
          status: 'working',
          progress: { phaseText: 'Đang bấm "Xem danh sách" & chờ bảng tải…' },
        });
        triggerEquipmentDebtViewList(doc);
        await waitForEquipmentReportLoad(doc, { timeoutMs: 20000 });
      }
    }

    const collected = await collectEquipmentDebtFromDocument(doc, {
      waitMs: 6500,
      onProgress: (p) => writeRes({ status: 'working', progress: p }),
    });
    if (collected.status === 'ok' && collected.dataset) {
      const endFilter = readEquipmentFilterState(doc);
      writeRes({
        status: 'ok',
        dataset: collected.dataset,
        currentFilter: {
          region: endFilter.region || filterToUse.region,
          province: endFilter.province || filterToUse.province,
          partner: endFilter.partner || filterToUse.partner,
        },
      });
      return true;
    }
    writeRes({ status: 'error', message: collected.message || 'Chưa đọc được bảng tồn nợ.' });
    return false;
  } catch (err) {
    writeRes({
      status: 'error',
      message: err && err.message ? err.message : 'Lỗi đọc dữ liệu qua cầu nối tab.',
    });
    return false;
  }
}
async function loadEquipmentDebtContext(ctx = {}) {
  if (!isUserscriptEnv() || ctx.forceDemo) {
    return {
      status: 'ok',
      mode: 'demo',
      dataset: buildDemoEquipmentDebtDataset(),
    };
  }

  const loc = ctx.pageLocation || null;
  const doc = ctx.pageDocument || null;

  if ((!isEquipmentPortalLocation(loc) || !doc) && canControlAndroidPortal()) {
    return loadEquipmentDebtViaAndroidPortal({
      activeFilter: ctx.activeFilter || getEffectiveEquipmentDebtFilter(),
      forceApplyFilter: Boolean(ctx.forceApplyFilter),
      onProgress: ctx.onProgress || null,
      maxPages: ctx.maxPages || 30,
      waitMs: ctx.waitMs || 6500,
    });
  }

  if (!isEquipmentPortalLocation(loc) || !doc) {
    if (!ctx.skipDesktopBridge) {
      const bridged = await tryLoadEquipmentDebtViaDesktopBridge(ctx);
      if (bridged) {
        return bridged;
      }
    }
    return {
      status: 'needs_equipment_page',
      mode: 'live',
      url: EQUIPMENT_ENDPOINTS.base,
      foxErpUrl: FOX_ERP_HOME_URL,
      message:
        'Chưa có tab Quản lý vật tư đang mở hợp lệ. Bấm nút bên dưới để mở qua Fox-ERP (tự cấp phiên đăng nhập và tự tải tồn nợ KTV).',
    };
  }

  if (isNextGenSessionExpiredDocument(doc)) {
    return {
      status: 'nextgen_session_expired',
      mode: 'live',
      foxErpUrl: FOX_ERP_HOME_URL,
      message:
        'Phiên Quản lý vật tư (NextGen) đã hết hạn do mở link ngoài hoặc hết giờ. Bấm "Cấp lại phiên qua Fox-ERP" bên dưới để mở lại đúng luồng và tự tải tồn nợ.',
    };
  }

  const ctrls = findEquipmentDebtPageControls(doc);
  const table = ctrls.grid ? findEquipmentTableInGrid(ctrls.grid) : null;
  const realRows = getEquipmentRealBodyRows(table);
  const columns = table ? parseEquipmentDebtColumns(table) : { materials: [] };
  const filterState = readEquipmentFilterState(doc);
  const currentFilter = {
    region: filterState.region,
    province: filterState.province,
    partner: filterState.partner,
  };

  if (
    !ctrls.hasDebtTab ||
    !ctrls.isDebtTabActive ||
    !ctrls.grid ||
    !table ||
    realRows.length === 0 ||
    columns.materials.length === 0
  ) {
    const hasReportMenuBtn = Boolean(findEquipmentReportMenuBtn(doc));
    const regionOptions = readEquipmentFilterOptions(doc, 'region').options;
    let message =
      'Bạn đang ở màn hình khác trên Quản lý vật tư (chưa mở Báo cáo → Báo cáo nợ). Bấm nút bên dưới để mở đúng trang Báo cáo nợ.';
    if (ctrls.hasDebtTab && !ctrls.isDebtTabActive) {
      message = 'Đang ở Báo cáo nợ nhưng chưa chọn tab "Tồn công nợ theo NV". Bấm chuyển tab bên dưới.';
    } else if (ctrls.hasDebtTab && filterState.missingRequired) {
      message =
        'Chọn Vùng / Tỉnh thành / Đối tác 1 lần bên dưới — Remote Inside sẽ lưu cố định và tự chọn ở những lần sau.';
    } else if (ctrls.hasDebtTab && ctrls.viewListBtn) {
      message =
        'Bảng "Tồn công nợ theo NV" chưa có dữ liệu. Bấm nút bên dưới để chạy "Xem danh sách" và gom KTV.';
    }

    return {
      status: 'needs_report_loaded',
      mode: 'live',
      hasDebtTab: ctrls.hasDebtTab,
      isDebtTabActive: ctrls.isDebtTabActive,
      hasViewListBtn: Boolean(ctrls.viewListBtn),
      hasReportMenuBtn,
      filterMissing: filterState.missingRequired,
      currentFilter,
      regionOptions,
      message,
    };
  }

  const collected = await collectEquipmentDebtFromDocument(doc, {
    onProgress: ctx.onProgress,
    maxPages: ctx.maxPages || 30,
    waitMs: ctx.waitMs || 5500,
  });
  return {
    ...collected,
    currentFilter,
  };
}

const RADIUS_ENDPOINTS = {

  CHANGE: 'http://radius-apigateway.fpt.net/api/v2/NetworkConnection/Change',

const RADIUS_NAT_OPTIONS = [
  { value: '1', label: 'Default NAT' },
  { value: '3', label: 'Khách hàng dùng Camera' },
  { value: '5', label: 'ByPass NAT' },

const RADIUS_IPV6_STATUS = {

  ACTIVE: 2,
  DEACTIVATE: 3,
};
const RADIUS_IPV6_OPTIONS = [
  { value: 3, label: 'Deactivate' },

];
const RADIUS_CONTRACT_STATUS_LABELS = {

const VALID_IPV6_VALUES = new Set(RADIUS_IPV6_OPTIONS.map((o) => Number(o.value)));
const NON_ASCII_RE = /[^\u0000-\u007F]/;

/**
 * Tra ve nhan hien thi cho Tinh trang NAT ("1" | "3" | "5").
 */
function getRadiusNatLabel(code) {
  const key = code === undefined || code === null ? '' : String(code).trim();
  const matched = RADIUS_NAT_OPTIONS.find((item) => String(item.value) === key);
  return matched ? matched.label : key ? `Mã ${key}` : 'Không xác định';
}

/**
 * Tra ve nhan hien thi cho IPv6 Status (0 | 2 | 3).
 */
function getRadiusIpv6Label(code) {
  if (code === undefined || code === null || code === '') {
    return 'Không xác định';
  }
  const num = Number(code);
  const matched = RADIUS_IPV6_OPTIONS.find((item) => Number(item.value) === num);
  return matched ? matched.label : `Mã ${num}`;
}

/**
 * Tra ve nhan tinh trang hop dong Radius.
 */
function getRadiusContractStatusLabel(code) {
  if (code === undefined || code === null || code === '') {
    return '—';
  }
  const num = Number(code);
  return RADIUS_CONTRACT_STATUS_LABELS[num] || `Mã ${num}`;
}

/**
 * Tra ve nhan IPv6 Only Status (-2 | 0 | 1 | 2).
 */
function getRadiusIpv6OnlyLabel(code) {
  if (code === undefined || code === null || code === '') {
    return 'Deactivate';
  }
  const key = String(Number(code));
  return RADIUS_IPV6_ONLY_LABELS[key] || `Mã ${key}`;
}

/**
 * Chuyen chuoi tieng Viet co dau thanh ASCII khong dau hop le cho Radius API.
 */
function stripVietnameseDiacritics(raw) {
  if (raw === undefined || raw === null) {
    return '';
  }
  return String(raw)
    .replace(/đ/g, 'd')
    .replace(/Đ/g, 'D')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\u0000-\u007F]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/**
 * Kiem tra ghi chu Radius: bat buoc nhap va chi cho phep tieng Viet khong dau (ASCII).
 */
function validateRadiusNote(raw, fieldLabel = '') {
  const value = typeof raw === 'string' ? raw.trim() : '';
  const prefix = fieldLabel ? `[${fieldLabel}] ` : '';
  if (!value) {
    return {
      valid: false,
      value: '',
      error: `${prefix}Ghi chú không được để trống (nhập tiếng Việt không dấu).`,
    };
  }
  if (NON_ASCII_RE.test(value)) {
    return {
      valid: false,
      value,
      error: `${prefix}Ghi chú bắt buộc là tiếng Việt KHÔNG DẤU (bấm "Bỏ dấu" để chuyển nhanh).`,
    };
  }
  return { valid: true, value, error: '' };
}

/**
 * Doc tam cookie accesstoken_iam_radius tu chuoi Cookie (khong luu tru).
 */
function parseRadiusTokenFromCookieString(cookieStr) {
  if (!cookieStr || typeof cookieStr !== 'string') {
    return '';
  }
  const parts = cookieStr.split(';');
  for (const part of parts) {
    const eqIdx = part.indexOf('=');
    if (eqIdx <= 0) continue;
    const name = part.slice(0, eqIdx).trim();
    if (name !== 'accesstoken_iam_radius') continue;
    const rawVal = part
      .slice(eqIdx + 1)
      .trim()
      .replace(/^"|"$/g, '');
    if (!rawVal) return '';
    try {
      return decodeURIComponent(rawVal).trim();
    } catch {
      return rawVal;
    }
  }
  return '';
}

/**
 * Chuan hoa 1 ban ghi ket noi Radius tu NetworkConnection/GetbyObjID.
 */
function normalizeRadiusRecord(raw = {}) {
  const src = raw && typeof raw === 'object' ? raw : {};
  const rawNat =
    src.statusNAT !== undefined && src.statusNAT !== null && String(src.statusNAT).trim() !== ''
      ? String(src.statusNAT).trim()
      : '1';
  const rawIpv6Num =
    src.statusIPv6 !== undefined && src.statusIPv6 !== null && src.statusIPv6 !== ''
      ? Number(src.statusIPv6)
      : RADIUS_IPV6_STATUS.RULE;
  const parsedObjId = Number(src.objID ?? src.objId ?? 0);

  return {
    objID: Number.isFinite(parsedObjId) ? parsedObjId : 0,
    contract: String(src.contract || '').trim().toUpperCase(),
    name: String(src.name || '').trim(),
    macAddress: String(src.macAddress || '').trim(),
    status:
      src.status !== undefined && src.status !== null && src.status !== ''
        ? Number(src.status)
        : 0,
    locationID:
      src.locationID !== undefined && src.locationID !== null ? Number(src.locationID) : 0,
    locationName: String(src.locationName || '').trim(),
    localTypeName: String(src.localTypeName || '').trim(),
    statusNAT: rawNat,
    descriptionNAT: String(src.descriptionNAT || '').trim(),
    statusIPv6: Number.isFinite(rawIpv6Num) ? rawIpv6Num : RADIUS_IPV6_STATUS.RULE,
    descriptionIPv6: String(src.descriptionIPv6 || '').trim(),
    ipV6Only:
      src.ipV6Only !== undefined && src.ipV6Only !== null && src.ipV6Only !== ''
        ? Number(src.ipV6Only)
        : 0,
    isIpv6Support: Boolean(src.isIpv6Support),
    dpi: src.dpi !== undefined && src.dpi !== null && src.dpi !== '' ? Number(src.dpi) : 0,
    coAID: src.coAID !== undefined && src.coAID !== null && src.coAID !== '' ? Number(src.coAID) : 0,
    poolListName: String(src.poolListName || '').trim(),
    ipAddress: String(src.ipAddress || '').trim(),
    callerID: String(src.callerID || '').trim(),
    ipRoute: String(src.ipRoute || '').trim(),
    ipRouteIPv6: String(src.ipRouteIPv6 || '').trim(),
  };
}

/**
 * Tao danh sach summaryFields de hien thi tren the ket qua Radius.
 */
function buildRadiusSummaryFields(rawRecord) {
  const rec = normalizeRadiusRecord(rawRecord);
  const ipMac =
    rec.ipAddress || rec.callerID
      ? [rec.ipAddress, rec.callerID].filter(Boolean).join(' / ')
      : '—';
  const regionLocalType =
    [rec.locationName, rec.localTypeName].filter(Boolean).join(' • ') || '—';

  return [
    { label: 'Số hợp đồng', value: rec.contract || '—' },
    { label: 'Mã đối tượng (ObjID)', value: rec.objID ? String(rec.objID) : '—' },
    { label: 'Tên truy nhập', value: rec.name || '—' },
    { label: 'Tình trạng HĐ', value: getRadiusContractStatusLabel(rec.status) },
    { label: 'Tình trạng NAT', value: `${getRadiusNatLabel(rec.statusNAT)} (${rec.statusNAT})` },
    { label: 'Ghi chú NAT', value: rec.descriptionNAT || '—' },
    { label: 'IPv6 Status', value: getRadiusIpv6Label(rec.statusIPv6) },
    { label: 'Ghi chú IPv6', value: rec.descriptionIPv6 || '—' },
    { label: 'Hỗ trợ IPv6', value: rec.isIpv6Support ? 'Có' : 'Không' },
    { label: 'IPv6 Only', value: getRadiusIpv6OnlyLabel(rec.ipV6Only) },
    { label: 'IP / MAC kết nối', value: ipMac },
    { label: 'Spam Pool', value: rec.poolListName || '—' },
    { label: 'Vùng miền / Gói cước', value: regionLocalType },
  ];
}

/**
 * Kiem tra va dung payload chuan cho POST /api/v2/NetworkConnection/Change.
 */
function buildRadiusChangePayload(rawRecord, draft = {}) {
  const rec = normalizeRadiusRecord(rawRecord);
  if (!rec.objID || rec.objID <= 0) {
    return {
      ok: false,
      error: 'Không có ObjID hợp lệ của hợp đồng để gửi cập nhật Radius.',
    };
  }

  const nextNatStatus =
    draft.natStatus !== undefined && draft.natStatus !== null && String(draft.natStatus).trim() !== ''
      ? String(draft.natStatus).trim()
      : rec.statusNAT;
  const natChanged = nextNatStatus !== String(rec.statusNAT);

  const hasDraftIpv6Status =
    draft.ipv6Status !== undefined &&
    draft.ipv6Status !== null &&
    String(draft.ipv6Status).trim() !== '';
  const nextIpv6Status = hasDraftIpv6Status ? Number(draft.ipv6Status) : Number(rec.statusIPv6);
  const rawDraftIpv6Note =
    typeof draft.ipv6Description === 'string'
      ? draft.ipv6Description.trim()
      : rec.descriptionIPv6;
  const ipv6StatusChanged = Number(nextIpv6Status) !== Number(rec.statusIPv6);
  const ipv6NoteEdited =
    typeof draft.ipv6Description === 'string' &&
    rawDraftIpv6Note.length > 0 &&
    rawDraftIpv6Note !== String(rec.descriptionIPv6 || '').trim();
  const ipv6Changed = ipv6StatusChanged || ipv6NoteEdited;

  const payload = {
    objID: Number(rec.objID),
    isKillSession: draft.isKillSession !== false,
  };
  const changes = { nat: false, ipv6: false };

  if (natChanged) {
    if (!VALID_NAT_VALUES.has(nextNatStatus)) {
      return {
        ok: false,
        error: 'Giá trị Tình trạng NAT không hợp lệ (chỉ chấp nhận 1, 3 hoặc 5).',
      };
    }
    const rawNatNote =
      typeof draft.natDescription === 'string' ? draft.natDescription : rec.descriptionNAT;
    const natNoteCheck = validateRadiusNote(rawNatNote, 'NAT');
    if (!natNoteCheck.valid) {
      return { ok: false, error: natNoteCheck.error };
    }
    payload.changeNAT = {
      natStatus: nextNatStatus,
      natDescription: natNoteCheck.value,
    };
    changes.nat = true;
  }

  if (ipv6Changed) {
    if (!VALID_IPV6_VALUES.has(nextIpv6Status)) {
      return {
        ok: false,
        error: 'Giá trị IPv6 Status không hợp lệ (chỉ chấp nhận Deactivate, Active hoặc Rule).',
      };
    }
    if (Number(rec.ipV6Only) === 1 && nextIpv6Status === RADIUS_IPV6_STATUS.DEACTIVATE) {
      return {
        ok: false,
        error: 'Thuê bao đang bật IPv6 Only, không thể chuyển IPv6 Status về Deactivate.',
      };
    }
    const ipv6NoteCheck = validateRadiusNote(rawDraftIpv6Note, 'IPv6');
    if (!ipv6NoteCheck.valid) {
      return { ok: false, error: ipv6NoteCheck.error };
    }
    payload.changeIpv6 = {
      ipv6Status: Number(nextIpv6Status),
      ipv6Description: ipv6NoteCheck.value,
    };
    changes.ipv6 = true;
  }

  if (!changes.nat && !changes.ipv6) {
    return {
      ok: false,
      error: 'Bạn chưa thay đổi Tình trạng NAT hoặc IPv6 Status nào so với hiện tại.',
    };
  }

  return {
    ok: true,
    payload,
    changes,
    nextNatStatus,
    nextIpv6Status,
  };
}

function tryParseJson(text) {
  if (!text || typeof text !== 'string') return null;
  try {
    return JSON.parse(text);
  } catch {
    return null;
  }
}

function extractMessageList(rawMsg) {
  if (!rawMsg) return [];
  if (Array.isArray(rawMsg)) {
    return rawMsg
      .map((item) => {
        if (typeof item === 'string') return item.trim();
        if (item && typeof item === 'object') {
          return String(item.message || item.error_message || item.detail || item.status || '').trim();
        }
        return '';
      })
      .filter(Boolean);
  }
  if (typeof rawMsg === 'string') {
    return rawMsg.trim() ? [rawMsg.trim()] : [];
  }
  return [];
}

/**
 * Phan tich phan hoi HTTP cua GetbyObjID.
 */
function parseRadiusLookupResponse(rawText, httpStatus = 200, contractId = '') {
  if (httpStatus === 401) {
    return {
      ok: false,
      authRequired: true,
      error: 'Phiên token Radius đã hết hạn hoặc chưa đồng bộ (HTTP 401).',
    };
  }
  if (httpStatus === 403) {
    return {
      ok: false,
      forbidden: true,
      error: 'Tài khoản không có quyền truy cập dữ liệu Radius (HTTP 403).',
    };
  }

  const json = tryParseJson(rawText);
  if (httpStatus < 200 || httpStatus >= 300) {
    const apiErr =
      (json && (json.error?.message || json.error_message || json.message)) ||
      `Lỗi máy chủ Radius (HTTP ${httpStatus || 0}).`;
    return { ok: false, error: String(apiErr) };
  }

  if (!json || typeof json !== 'object') {
    return {
      ok: false,
      error: 'Phản hồi từ Radius API không đúng định dạng JSON.',
    };
  }

  if (json.error_code !== undefined && Number(json.error_code) !== 0) {
    return {
      ok: false,
      error: String(json.error_message || json.status || 'Tra cứu Radius thất bại.'),
    };
  }

  const rows = Array.isArray(json.data) ? json.data : [];
  if (rows.length === 0) {
    return {
      ok: false,
      notFound: true,
      error:
        String(json.error_message || '').trim() ||
        `Không tìm thấy thông số kết nối trên Radius cho ${contractId || 'hợp đồng này'}.`,
    };
  }

  const normalizedRows = rows.map(normalizeRadiusRecord);
  const preferred =
    (contractId && normalizedRows.find((r) => r.contract === contractId)) || normalizedRows[0];

  return {
    ok: true,
    record: preferred,
    records: normalizedRows,
  };
}

/**
 * Phan tich phan hoi HTTP cua POST /api/v2/NetworkConnection/Change.
 */
function parseRadiusChangeResponse(rawText, httpStatus = 200) {
  if (httpStatus === 401) {
    return {
      ok: false,
      authRequired: true,
      error: 'Phiên token Radius đã hết hạn (HTTP 401). Hãy đồng bộ IAM hoặc đăng nhập lại Radius.',
    };
  }
  if (httpStatus === 403) {
    return {
      ok: false,
      forbidden: true,
      error: 'Tài khoản không có quyền cập nhật cấu hình Radius (HTTP 403).',
    };
  }

  const json = tryParseJson(rawText);
  if (httpStatus < 200 || httpStatus >= 300) {
    const apiErr =
      (json &&
        ((json.error && json.error.message) ||
          json.error_message ||
          extractMessageList(json.message).join(' • '))) ||
      `Cập nhật Radius thất bại (HTTP ${httpStatus || 0}).`;
    return { ok: false, error: String(apiErr) };
  }

  if (!json || typeof json !== 'object') {
    return {
      ok: true,
      message: 'Đã gửi yêu cầu cập nhật Radius thành công.',
      details: [],
    };
  }

  const msgList = extractMessageList(json.message);
  const statusText = String(json.status || '').trim();
  const errCode =
    json.error_code !== undefined && json.error_code !== null ? Number(json.error_code) : 0;

  if ((Number.isFinite(errCode) && errCode !== 0 && errCode !== 200) || /^fail$/i.test(statusText)) {
    return {
      ok: false,
      error:
        String(json.error_message || '').trim() ||
        msgList.join(' • ') ||
        'Radius trả về trạng thái cập nhật không thành công.',
      details: msgList,
    };
  }

  const combinedMsg =
    msgList.join(' • ') ||
    String(json.error_message || '').trim() ||
    'Đã cập nhật thông số Radius thành công.';

  return {
    ok: true,
    message: combinedMsg,
    details: msgList,
  };
}

function getTransientPageToken(ctx = {}) {
  const doc =
    ctx.pageDocument || (typeof document !== 'undefined' ? document : null);
  if (!doc || typeof doc.cookie !== 'string') {
    return '';
  }
  return parseRadiusTokenFromCookieString(doc.cookie);
}

async function requestRadiusApi(url, { method = 'POST', body = null, ctx = {}, allowWarmRetry = true } = {}) {
  const payloadStr = body !== null && body !== undefined ? JSON.stringify(body) : null;

  if (isAndroidAppEnv()) {
    const res = await requestPortal({
      url,
      method,
      headers: {
        'Content-Type': 'application/json',
        Accept: 'application/json',
      },
      data: payloadStr,
      timeout: 15000,
      useRadiusBearer: true,
    });

    const missingTokenOr401 =
      res.status === 401 || res.error === 'RADIUS_TOKEN_MISSING';
    if (missingTokenOr401 && allowWarmRetry && canWarmPortalSession()) {
      const warmRes = await warmPortalSession(RADIUS_ENDPOINTS.PORTAL_URL, {
        force: true,
        timeout: 15000,
      });
      if (warmRes && warmRes.ok) {
        return requestRadiusApi(url, { method, body, ctx, allowWarmRetry: false });
      }
      return {
        ok: false,
        status: 401,
        responseText: '',
        error: 'RADIUS_TOKEN_MISSING',
        authRequired: true,
      };
    }
    return res;
  }

  const pageToken = getTransientPageToken(ctx);
  if (!pageToken) {
    return {
      ok: false,
      status: 401,
      responseText: '',
      error: 'RADIUS_PORTAL_COOKIE_UNAVAILABLE',
      authRequired: true,
    };
  }

  return requestPortal({
    url,
    method,
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json',
      Authorization: `Bearer ${pageToken}`,
    },
    data: payloadStr,
    timeout: 15000,
  });
}

function buildRadiusAuthErrorResult(detail = '') {
  const onAndroid = isAndroidAppEnv();
  return {
    status: 'iam_expired',
    message:
      detail ||
      (onAndroid
        ? 'Chưa có token truy cập Radius (accesstoken_iam_radius). Bấm "Đăng nhập Radius (IAM)" để đồng bộ phiên và thử lại.'
        : 'Đang chạy ở tab khác nên trình duyệt chưa đọc được cookie Radius. Hãy mở trang http://radius-portal.fpt.net/networkConnection đang đăng nhập IAM rồi bấm lại.'),
    loginUrl: RADIUS_ENDPOINTS.PORTAL_URL,
  };
}

/**
 * Tra cuu thong tin ket noi Radius theo So HD / ObjID / Username.
 */
async function fetchRadiusConnection(rawContractId, ctx = {}) {
  const check = validateContractId(rawContractId);
  if (!check.valid) {
    return {
      status: 'validation_error',
      message: check.error,
    };
  }
  const contractId = check.value;

  if (!isUserscriptEnv() || ctx.forceDemo) {
    await sleep(220);
    const demoRec = getOrCreateDemoRecord(contractId);
    return {
      status: 'ok',
      mode: 'demo',
      record: demoRec,
      summaryFields: buildRadiusSummaryFields(demoRec),
    };
  }

  const res = await requestRadiusApi(RADIUS_ENDPOINTS.GET_BY_OBJ_ID, {
    method: 'POST',
    body: { searchType: 1, searchValue: contractId },
    ctx,
  });

  if (res.authRequired) {
    return buildRadiusAuthErrorResult();
  }
  if (!res.status && res.error) {
    return {
      status: 'error',
      message: `Không thể kết nối máy chủ Radius (${res.error}). Kiểm tra lại VPN công ty.`,
      loginUrl: RADIUS_ENDPOINTS.PORTAL_URL,
    };
  }

  const parsed = parseRadiusLookupResponse(res.responseText, res.status, contractId);
  if (parsed.authRequired) {
    return buildRadiusAuthErrorResult(parsed.error);
  }
  if (!parsed.ok) {
    return {
      status: 'error',
      message: parsed.error,
      loginUrl: RADIUS_ENDPOINTS.PORTAL_URL,
    };
  }

  return {
    status: 'ok',
    mode: 'live',
    record: parsed.record,
    records: parsed.records,
    summaryFields: buildRadiusSummaryFields(parsed.record),
  };
}

/**
 * Gui thay doi IPNAT / IPv6 / Kill Session len POST /api/v2/NetworkConnection/Change.
 */
async function submitRadiusConnectionChange(rawRecord, draft = {}, ctx = {}) {
  const rec = normalizeRadiusRecord(rawRecord);
  const built = buildRadiusChangePayload(rec, draft);
  if (!built.ok) {
    return {
      status: 'validation_error',
      message: built.error,
    };
  }

  if (!isUserscriptEnv() || ctx.forceDemo) {
    await sleep(250);
    const updated = { ...rec };
    if (built.payload.changeNAT) {
      updated.statusNAT = built.payload.changeNAT.natStatus;
      updated.descriptionNAT = built.payload.changeNAT.natDescription;
    }
    if (built.payload.changeIpv6) {
      updated.statusIPv6 = built.payload.changeIpv6.ipv6Status;
      updated.descriptionIPv6 = built.payload.changeIpv6.ipv6Description;
    }
    if (updated.contract) {
      demoRadiusRecords.set(updated.contract, updated);
    }
    return {
      status: 'ok',
      mode: 'demo',
      record: updated,
      payload: built.payload,
      changes: built.changes,
      summaryFields: buildRadiusSummaryFields(updated),
      message: `Đã mô phỏng cập nhật Radius cho ${updated.contract || updated.objID} (${
        built.payload.isKillSession ? 'kèm Kill Session' : 'không Kill Session'
      }).`,
    };
  }

  const res = await requestRadiusApi(RADIUS_ENDPOINTS.CHANGE, {
    method: 'POST',
    body: built.payload,
    ctx,
  });

  if (res.authRequired) {
    return buildRadiusAuthErrorResult();
  }
  if (!res.status && res.error) {
    return {
      status: 'error',
      message: `Không thể gửi lệnh cập nhật Radius (${res.error}). Kiểm tra lại VPN công ty.`,
      loginUrl: RADIUS_ENDPOINTS.PORTAL_URL,
    };
  }

  const parsed = parseRadiusChangeResponse(res.responseText, res.status);
  if (parsed.authRequired) {
    return buildRadiusAuthErrorResult(parsed.error);
  }
  if (!parsed.ok) {
    return {
      status: 'error',
      message: parsed.error,
      loginUrl: RADIUS_ENDPOINTS.PORTAL_URL,
    };
  }

  let freshRecord = {
    ...rec,
    ...(built.payload.changeNAT
      ? {
          statusNAT: built.payload.changeNAT.natStatus,
          descriptionNAT: built.payload.changeNAT.natDescription,
        }
      : {}),
    ...(built.payload.changeIpv6
      ? {
          statusIPv6: built.payload.changeIpv6.ipv6Status,
          descriptionIPv6: built.payload.changeIpv6.ipv6Description,
        }
      : {}),
  };

  if (rec.contract) {
    const refreshed = await fetchRadiusConnection(rec.contract, ctx);
    if (refreshed.status === 'ok' && refreshed.record) {
      freshRecord = refreshed.record;
    }
  }

  return {
    status: 'ok',
    mode: 'live',
    record: freshRecord,
    payload: built.payload,
    changes: built.changes,
    summaryFields: buildRadiusSummaryFields(freshRecord),
    message: parsed.message,
  };
}

/**
 * Thuc thi hanh dong tu giao dien cho cong Radius Portal.
 */
async function runRadiusAction(actionId, rawContractId, ctx = {}) {
  const portal = PORTALS.radius;
  const action = portal.actions.find((a) => a.id === actionId);
  if (!action) {
    return {
      status: 'error',
      message: 'Thao tác không hợp lệ trên Radius Portal.',
    };
  }

  const check = validateContractId(rawContractId);
  if (!check.valid) {
    return {
      status: 'validation_error',
      message: check.error,
    };
  }
  const contractId = check.value;

  if (actionId === 'check_radius') {
    const lookup = await fetchRadiusConnection(contractId, ctx);
    if (lookup.status !== 'ok') {
      return lookup;
    }
    const demoSuffix = lookup.mode === 'demo' ? ' (Dữ liệu mô phỏng)' : '';
    return {
      status: 'ok',
      mode: lookup.mode,
      title: `Thông số Radius — ${contractId}${demoSuffix}`,
      message: `NAT: ${getRadiusNatLabel(lookup.record.statusNAT)} • IPv6: ${getRadiusIpv6Label(
        lookup.record.statusIPv6
      )}`,
      summaryFields: lookup.summaryFields,
      radiusRecord: lookup.record,
      sourceUrl: RADIUS_ENDPOINTS.PORTAL_URL,
      sourceLabel: 'Mở Radius Portal',
    };
  }

  let baseRecord = ctx.record ? normalizeRadiusRecord(ctx.record) : null;
  if (!baseRecord || !baseRecord.objID) {
    const lookup = await fetchRadiusConnection(contractId, ctx);
    if (lookup.status !== 'ok') {
      return lookup;
    }
    baseRecord = lookup.record;
  }

  let draft = {
    natStatus: ctx.natStatus !== undefined ? ctx.natStatus : baseRecord.statusNAT,
    natDescription:
      ctx.natDescription !== undefined ? ctx.natDescription : baseRecord.descriptionNAT,
    ipv6Status: ctx.ipv6Status !== undefined ? ctx.ipv6Status : baseRecord.statusIPv6,
    ipv6Description:
      ctx.ipv6Description !== undefined ? ctx.ipv6Description : baseRecord.descriptionIPv6,
    isKillSession: ctx.isKillSession !== false,
  };

  if (actionId === 'remove_ipnat' && ctx.natStatus === undefined) {
    draft.natStatus = '5';
    draft.natDescription = draft.natDescription || 'KH yeu cau bo IPNAT';
  }
  if (actionId === 'remove_ipv6' && ctx.ipv6Status === undefined) {
    draft.ipv6Status = RADIUS_IPV6_STATUS.DEACTIVATE;
    draft.ipv6Description = draft.ipv6Description || 'Bo IPv6 cho KH';
  }

  const submitRes = await submitRadiusConnectionChange(baseRecord, draft, ctx);
  if (submitRes.status !== 'ok') {
    return submitRes;
  }

  const changedParts = [];
  if (submitRes.changes.nat) {
    changedParts.push(`NAT -> ${getRadiusNatLabel(submitRes.record.statusNAT)}`);
  }
  if (submitRes.changes.ipv6) {
    changedParts.push(`IPv6 -> ${getRadiusIpv6Label(submitRes.record.statusIPv6)}`);
  }
  const killNote = submitRes.payload.isKillSession ? 'Có Kill Session' : 'Không Kill Session';
  const demoSuffix = submitRes.mode === 'demo' ? ' (Mô phỏng)' : '';

  return {
    status: 'ok',
    mode: submitRes.mode,
    title: `Đã cập nhật Radius — ${contractId}${demoSuffix}`,
    message: `${submitRes.message} (${[...changedParts, killNote].join(' • ')})`,
    summaryFields: submitRes.summaryFields,
    radiusRecord: submitRes.record,
    sourceUrl: RADIUS_ENDPOINTS.PORTAL_URL,
    sourceLabel: 'Mở Radius Portal',
  };
}

/**
 * Thuc thi hanh dong tu giao dien cho bat ky portal nao trong 5 cong.
 */
async function executePortalAction(portalId, actionId, rawContractId, ctx = {}) {
  const portal = PORTALS[portalId];
  if (!portal) {
    return {
      status: 'error',
      message: 'Không tìm thấy cổng công cụ tương ứng.',
    };
  }

  if (portalId === 'inside') {
    return runInsideAction(actionId, rawContractId, ctx);
  }
  if (portalId === 'port') {
    return runPortAction(actionId, rawContractId, ctx);
  }
  if (portalId === 'recall') {
    return runRecallAction(actionId, rawContractId, ctx);
  }
  if (portalId === 'radius') {
    return runRadiusAction(actionId, rawContractId, ctx);
  }

  const check = validateContractId(rawContractId);
  if (!check.valid) {
    return {
      status: 'validation_error',
      message: check.error,
    };
  }

  const action = portal.actions.find((a) => a.id === actionId);
  if (!action) {
    return {
      status: 'error',
      message: 'Thao tác không hợp lệ trên cổng này.',
    };
  }

  const contractId = check.value;

  if (!isUserscriptEnv() || ctx.forceDemo) {
    await sleep(350);
    return buildPlannedDemoResult(portal, action, contractId);
  }

  const session = await checkPortalSession(portal);
  if (session.state === 'iam_expired') {
    return {
      status: 'iam_expired',
      message: `Phiên đăng nhập IAM cho ${portal.fullName} đã hết hạn. Bấm nút bên dưới để đăng nhập lại.`,
      loginUrl: session.loginUrl,
    };
  }
  if (session.state === 'offline') {
    return {
      status: 'error',
      message: session.detail,
      loginUrl: session.loginUrl,
    };
  }

  return {
    status: 'needs_scan',
    message: `Đã xác nhận kết nối tới ${portal.fullName} (IAM hợp lệ). Cổng này đang chờ ghép nối ở đợt tiếp theo — bạn có thể bấm "Quét cấu trúc" ngay hoặc mở nhanh trang gốc với Mã HĐ đã sao chép.`,
    hint: `Mã HĐ ${contractId} đã được lưu vào danh sách gần đây để bạn dán nhanh.`,
    loginUrl: portal.url,
  };
}

function formatVndAmount(amount) {
  const num = Number(amount ?? 0);
  if (!Number.isFinite(num)) return '0 đ';
  return `${num.toLocaleString('vi-VN')} đ`;
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === 'className') {
      node.className = v;
    } else if (k === 'text') {
      node.textContent = v;
    } else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else if (k === 'disabled') {
      node.disabled = Boolean(v);
    } else {
      node.setAttribute(k, String(v));
    }
  }
  for (const child of children) {
    if (child === null || child === undefined) continue;
    if (typeof child === 'string') {
      node.appendChild(document.createTextNode(child));
    } else {
      node.appendChild(child);
    }
  }
  return node;
}

function formatTime(date = new Date()) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

async function copyTextSafe(text) {
  if (!text) return false;
  try {
    if (
      isAndroidAppEnv() &&
      typeof window !== 'undefined' &&
      window.RemoteInsideNative &&
      typeof window.RemoteInsideNative.copyText === 'function'
    ) {
      if (window.RemoteInsideNative.copyText(String(text))) {
        return true;
      }
    }
  } catch {
    // Fallback sang GM_setClipboard / navigator.clipboard
  }
  try {
    if (typeof GM_setClipboard === 'function') {
      GM_setClipboard(text, 'text');
      return true;
    }
  } catch {
    // Fallback sang navigator.clipboard
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {
    // Fallback textarea tam
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch {
    return false;
  }
}

function downloadJsonFile(filename, content) {
  const blob = new Blob([content], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

      } else if (okLabels.length > 0) {
        const parts = [`Đã sẵn sàng: ${okLabels.join(', ')}.`];
        if (needsLogin.length > 0) {
          parts.push(
            `${needsLogin.map((t) => t.label).join(', ')} yêu cầu xác nhận Azure AD thêm 1 chạm khi mở.`
          );
        }
        if (offline.length > 0) {
          parts.push(
            `Chưa chạm tới được (kiểm tra VPN): ${offline.map((t) => t.label).join(', ')}.`
          );
        }
        state.result = {
          status: 'ok',
          title: `Đã đồng bộ ${okLabels.length}/${report.results.length} cổng IAM`,
          message: parts.join(' '),
          loginUrl: needsLogin.length > 0 ? needsLogin[0].url : '',
          showLoginBtn: needsLogin.length > 0,
        };
      } else {
        const parts = ['Phiên IAM (Azure AD) chưa sẵn sàng để đồng bộ.'];
        if (offline.length > 0) {
          parts.push(
            `Không chạm tới được (kiểm tra VPN): ${offline.map((t) => t.label).join(', ')}.`
          );
        }
        state.result = {
          status: 'iam_expired',
          title: 'Chưa hoàn tất đăng nhập IAM',
          message: parts.join(' '),
          loginUrl: needsLogin.length > 0 ? needsLogin[0].url : getUnifiedIamLoginUrl(),
        };
      }
      renderMain();
    }
    return report;
  }

  async function bootstrapAndroidAuthGate({
    autoOpenLogin = false,
    allowSsoWarmup = true,
  } = {}) {
    if (!standalone || !isAndroidAppEnv()) {
      state.authGate = 'unlocked';
      return;
    }

    state.authGate = 'checking';
    state.authGateDetail = 'Đang kiểm tra phiên đăng nhập cổng nội bộ FPT…';
    renderMain();

    const checked = await checkPortalSession(PORTALS.inside, { allowSsoWarmup });
    if (checked.state === 'ok') {
      state.authGate = 'unlocked';
      state.authGateReason = '';
      state.authGateDetail = '';
      state.authGateAutoOpened = false;
      state.sessionStatus = checked;
      render();
      if (state.activePortalId !== 'inside') {
        refreshSessionStatus();
      }
      return;
    }

    state.sessionStatus = checked;
    state.authGate = 'locked';
    if (checked.state === 'iam_expired') {
      state.authGateReason = 'iam_expired';
      state.authGateDetail =
        checked.detail || 'Chưa có phiên đăng nhập trên cổng nội bộ FPT.';
      render();
      if (autoOpenLogin && !state.authGateAutoOpened) {
        state.authGateAutoOpened = true;
        openFptInternalLoginGate();
      }
      return;
    }

    state.authGateReason = 'offline';
    state.authGateDetail =
      checked.detail || 'Chưa chạm tới được inside.fpt.net. Hãy bật VPN công ty.';
    render();
  }

    const portal = PORTALS[state.activePortalId];
    if (!isUserscriptEnv()) {
      state.sessionStatus = {
        state: 'demo',

        loginUrl: portal.url,
        detail: 'Đang chạy mô phỏng cục bộ (chưa gắn Tampermonkey).',
      };
      syncSessionPillOrRenderMain();
      return;
    }

    state.sessionStatus = {
      state: 'checking',
      label: 'Đang kiểm tra…',
      loginUrl: portal.url,
      detail: '',
    };
    syncSessionPillOrRenderMain();
    const checkUrlOverride =
      portal.id === 'port' && portal.sessionCheckUrl
        ? buildPortUrl(portal.sessionCheckUrl)
        : '';
    let checked = await checkPortalSession(portal, { checkUrlOverride });
    if (portal.id === 'port' && checked.state === 'iam_expired') {
      const boot = await bootstrapMvcPortSession();
      if (boot && boot.ok) {
        checked = {
          state: 'ok',
          label: 'IAM ổn',
          loginUrl: portal.url,
          detail: 'Đã tự động kích hoạt và kết nối tốt tới port.fpt.net (FTTH NEW).',

      } else if (isLoggedInPortHost()) {
        checked.label = 'Chưa bật FTTH NEW';

          'Bạn đã vào port.fpt.net nhưng FTTH NEW (mvcport.fpt.net) chưa kích hoạt. Bấm menu trái: FTTH NEW → Hợp đồng → Tìm kiếm 1 lần rồi bấm lại vào ô trạng thái này.';

    }

      state.sessionStatus = checked;
      syncSessionPillOrRenderMain();
    }
  }

  async function handlePasteContract() {
    try {
      if (
        isAndroidAppEnv() &&
        typeof window !== 'undefined' &&
        window.RemoteInsideNative &&
        typeof window.RemoteInsideNative.readClipboard === 'function'
      ) {
        const nativeText = window.RemoteInsideNative.readClipboard();
        const nativeCleaned = normalizeContractId(nativeText);
        if (nativeCleaned) {
          setContractValue(nativeCleaned);
          return;
        }
      }
      if (navigator.clipboard && navigator.clipboard.readText) {
        const text = await navigator.clipboard.readText();
        const cleaned = normalizeContractId(text);
        if (cleaned) {
          setContractValue(cleaned);
          return;
        }
      }
      state.result = {
        status: 'warn',
        title: 'Chưa dán được tự động',
        message: 'Trình duyệt đang chặn đọc bộ nhớ tạm. Bạn chạm trực tiếp vào ô Mã hợp đồng rồi chọn Dán nhé.',

      render();
    } catch {
      state.result = {
        status: 'warn',
        title: 'Chưa dán được tự động',
        message: 'Bạn chạm trực tiếp vào ô Mã hợp đồng rồi chọn Dán nhé.',

    }
  }

  function applyDetectedOltToModal() {
    if (!state.oltDetectedInfo || state.oltUserTouched || state.oltList.length === 0) {
      return;
    }
    const matched = findMatchingOltOption(state.oltList, state.oltDetectedInfo.oltPop);
    if (!matched) {
      state.oltAutoMatched = false;
      return;
    }

    state.oltSelectedId = matched.id;
    state.oltSearch = '';
    state.oltAutoMatched = true;
    state.oltShowAllPorts = isExtendedPortOlt(matched.name);

    const detectedPort = String(state.oltDetectedInfo.port || '').trim();
    if (detectedPort) {
      const portsSrc =
        state.oltPorts.length > 0
          ? state.oltPorts
          : Array.from({ length: 16 }, (_, idx) => ({
              value: String(idx + 1),
              label: `Port ${idx + 1}`,
              isType2: idx + 1 > 8,
            }));
      const matchedPort = portsSrc.find(
        (p) =>
          String(p.value).trim() === detectedPort ||
          (Number.isFinite(Number(p.value)) &&
            Number.isFinite(Number(detectedPort)) &&
            Number(p.value) === Number(detectedPort))
      );
      if (matchedPort) {
        state.oltSelectedPorts = [matchedPort.value];
        if (matchedPort.isType2) {
          state.oltShowAllPorts = true;
        }
      }
    }
  }

      ) {
        return;
      }
      const data = event.data;
      if (!data || data.type !== 'RI_RADIUS_OLT_INFO' || !data.oltPop) {
        return;
      }
      const saved = setInsideOltHint(data.objId, data);
      if (
        state.confirmAction &&
        state.confirmAction.id === 'clear_osp' &&
        state.activePortalId === 'inside'
      ) {
        if (!data.objId || !state.oltContractObjId || String(data.objId) === String(state.oltContractObjId)) {
          const nextInfo = saved || {
            objId: String(data.objId || ''),
            oltPop: String(data.oltPop || ''),
            slot: String(data.slot || ''),
            port: String(data.port || ''),
            onu: String(data.onu || ''),
            ipOlt: String(data.ipOlt || ''),
          };
          if (isSameOltDetectedInfo(state.oltDetectedInfo, nextInfo)) {

    const grant = state.deployGrant || '';
    try {

        fetchDeploymentPhones({
          contract: summary.contract,
          objId: summary.objId,
          grant,

        fetchDeploymentEContracts({
          objId: summary.objId,
          grant,

      ]);
      if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') {

  function applyDefaultDeployReassignSelection(partnerData, ticket) {
    const partners =
      partnerData && Array.isArray(partnerData.Partners) ? partnerData.Partners : [];
    const byDept =
      ticket && ticket.deptId ? findPartnerByDeptId(partners, ticket.deptId) : null;
    const byTicketPartner =
      !byDept && ticket && ticket.partnerId
        ? partners.find((p) => p && Number(p.Partner) === Number(ticket.partnerId))
        : null;
    const fallbackSingle =
      !byDept && !byTicketPartner && partners.length === 1 ? partners[0] : null;
    const chosenPartner = byDept || byTicketPartner || fallbackSingle || null;
    state.deployReassignPartnerId = chosenPartner ? String(chosenPartner.Partner) : '';

    if (chosenPartner) {
      const blocks = filterBlocksByPartner(partnerData, chosenPartner.Partner);
      let chosenBlock = null;
      if (ticket && ticket.blockId) {
        chosenBlock = blocks.find((b) => b && Number(b.Id) === Number(ticket.blockId)) || null;
      }
      if (!chosenBlock && ticket && ticket.blockDepName) {
        const targetName = String(ticket.blockDepName).trim().toLowerCase();
        chosenBlock =
          blocks.find(
            (b) => b && String(b.SubName || '').trim().toLowerCase() === targetName
          ) || null;
      }
      if (!chosenBlock && blocks.length === 1) {
        chosenBlock = blocks[0];
      }
      state.deployReassignBlockId = chosenBlock ? String(chosenBlock.Id) : '';
    } else {
      state.deployReassignBlockId = '';
    }
    state.deployReassignEmpCode = '';
  }

  async function loadDeployReassignData({ forceReload = false, locationIdOverride = '' } = {}) {
    const summary = state.deploySummary;
    const ticket = summary && summary.ticket ? summary.ticket : null;
    if (!summary || !ticket) return;
    if (!forceReload && !locationIdOverride && state.deployReassignPartnerData) {
      return;
    }

    state.deployReassignLoading = true;
    state.deployReassignError = '';
    renderConfirm();

    const grant = state.deployGrant || '';
    try {
      let userInfo = state.deployUserInfo;
      if (!userInfo || forceReload) {
        const userRes = await fetchDeploymentUserInfo({ grant });
        if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
        if (userRes.status === 'ok' && userRes.userInfo) {
          userInfo = userRes.userInfo;
          state.deployUserInfo = userInfo;
        } else if (userRes.status === 'iam_expired') {
          state.deployReassignLoading = false;
          state.deployReassignError =
            userRes.message || 'Phiên đăng nhập FOX-ERP chưa sẵn sàng.';
          state.deployLoginUrl = userRes.loginUrl || DEPLOYMENT_ENDPOINTS.foxTicketPage;
          renderConfirm();
          return;
        }
      }

      const locs = userInfo && Array.isArray(userInfo.locations) ? userInfo.locations : [];
      const userLocId = userInfo ? userInfo.locationId : 0;
      const targetLocationId = locationIdOverride
        ? Number(locationIdOverride)
        : Number(state.deployReassignLocationId || 0) ||
          resolveDefaultDeploymentLocationId(ticket, summary, locs, userLocId);

      state.deployReassignLocationId = targetLocationId ? String(targetLocationId) : '';
      state.deployReassignPartnerData = null;
      state.deployReassignPartnerId = '';
      state.deployReassignBlockId = '';
      state.deployReassignEmpCode = '';

      const partnerRes = await fetchDeploymentPartnerData({
        locationId: targetLocationId,
        grant,
      });
      if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
      state.deployReassignLoading = false;

      if (partnerRes.status !== 'ok') {
        state.deployReassignError =
          partnerRes.message || 'Không tải được danh sách Đối tác / Tổ / KTV.';
        if (partnerRes.loginUrl) {
          state.deployLoginUrl = partnerRes.loginUrl;
        }
      } else {
        state.deployReassignPartnerData = partnerRes.partnerData || null;
        applyDefaultDeployReassignSelection(state.deployReassignPartnerData, ticket);
      }
    } catch (err) {
      if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
      state.deployReassignLoading = false;
      state.deployReassignError =
        err && err.message ? err.message : 'Lỗi tải dữ liệu Phân tuyến KTV.';
    }
    renderConfirm();
  }

  async function runDeployMutation({
    busyKey,
    pendingText,
    fallbackErr,
    logAction,
    fn,
    onOk,
  }) {
    const summary = state.deploySummary;
    const ticket = summary && summary.ticket ? summary.ticket : null;
    if (!summary || !ticket || state.deployBusyAction) return;
    state.deployArmedAction = '';
    state.deployBusyAction = busyKey;
    state.deployNotice = pendingText;
    state.deployNoticeTone = 'info';
    renderConfirm();

    try {
      const res = await fn(summary, ticket);
      if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
      state.deployBusyAction = '';
      if (res.status === 'ok') {
        state.deployNotice = res.message || 'Thao tác thành công.';
        state.deployNoticeTone = 'ok';
        addLog('Inside', logAction, ticket.depCode || summary.contract, res.mode === 'demo' ? 'demo' : 'ok');
        if (onOk) {
          await onOk(res);
          if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
        }
      } else {
        state.deployNotice = res.message || fallbackErr;
        state.deployNoticeTone = 'error';
        if (res.loginUrl) {
          state.deployLoginUrl = res.loginUrl;
        }
        addLog('Inside', logAction, ticket.depCode || summary.contract, 'error');
      }
    } catch (err) {
      if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
      state.deployBusyAction = '';
      state.deployNotice = err && err.message ? err.message : fallbackErr;
      state.deployNoticeTone = 'error';
    }
    renderConfirm();
  }

  function handleDeployReassignSubmit() {
    const summary = state.deploySummary;
    const ticket = summary && summary.ticket ? summary.ticket : null;
    if (!summary || !ticket) return;

    const partnerData = state.deployReassignPartnerData;
    const partners =
      partnerData && Array.isArray(partnerData.Partners) ? partnerData.Partners : [];
    const selectedPartner =
      partners.find((p) => String(p.Partner) === String(state.deployReassignPartnerId)) || null;
    const blocks = selectedPartner
      ? filterBlocksByPartner(partnerData, selectedPartner.Partner)
      : [];
    const selectedBlock =
      blocks.find((b) => String(b.Id) === String(state.deployReassignBlockId)) || null;
    const employees = selectedBlock ? filterEmployeesByBlock(partnerData, selectedBlock.Id) : [];
    const selectedEmployee =
      employees.find(
        (e) => String(e.CodeEmployee) === String(state.deployReassignEmpCode)
      ) || null;
    const reasonOptions = parseDataFilterOptions(
      state.deployDataFilter,
      DEPLOYMENT_CATALOG_KEYS.REASON_CHANGE_EMPLOYEE
    );
    const selectedReason =
      reasonOptions.find((r) => String(r.id) === String(state.deployReassignReasonId)) || null;

    const check = validateAndBuildReassignPayload({
      objId: summary.objId,
      supId: ticket.supId,
      contract: summary.contract,
      locationId: state.deployReassignLocationId,
      partnerData,
      partner: selectedPartner,
      block: selectedBlock,
      employee: selectedEmployee,
      reason: selectedReason,
    });
    if (!check.valid) {
      state.deployArmedAction = '';
      state.deployNotice = check.error;
      state.deployNoticeTone = 'error';
      renderConfirm();
      return;
    }

    const grant = state.deployGrant || '';
    const targetSupId = ticket.supId;
    const targetPartner = selectedPartner;
    const targetBlock = selectedBlock;
    const targetEmployee = selectedEmployee;

    return runDeployMutation({
      busyKey: 'reassign_emp',
      pendingText: `Đang phân tuyến ${ticket.depCode || summary.contract} cho ${check.payload.EmpAccount}…`,
      fallbackErr: 'Phân tuyến không thành công.',
      logAction: 'Phân tuyến KTV',
      fn: (curSummary, curTicket) =>
        reassignDeploymentEmployee({
          objId: curSummary.objId,
          supId: curTicket.supId,
          contract: curSummary.contract,
          locationId: state.deployReassignLocationId,
          partnerData,
          partner: targetPartner,
          block: targetBlock,
          employee: targetEmployee,
          reason: selectedReason,
          grant,
        }),
      onOk: async (res) => {
        let nextMainEmp = {
          account: targetEmployee.InsideAccount || '',
          name: targetEmployee.InsideAccount || '',
          phone: '',
          code: String(targetEmployee.CodeEmployee ?? ''),
          status: 1,
        };
        let nextSupportEmps = ticket.supportEmps || [];
        let empRefreshWarn = '';

        if (res.mode !== 'demo') {
          const empRes = await fetchDeploymentAssignedEmps({
            supId: targetSupId,
            objId: summary.objId,
            grant,
          });
          if (!state.confirmAction || state.confirmAction.id !== 'deploy_ticket') return;
          if (empRes.status === 'ok') {
            if (empRes.mainEmp) {
              nextMainEmp = empRes.mainEmp;
            }
            nextSupportEmps = empRes.supportEmps || [];
          } else {
            empRefreshWarn = empRes.message || '';
          }
        }

        if (state.deploySummary && Array.isArray(state.deploySummary.tickets)) {
          const updatedTickets = state.deploySummary.tickets.map((t) =>
            Number(t.supId) === Number(targetSupId)
              ? {
                  ...t,
                  mainEmp: nextMainEmp,
                  supportEmps: nextSupportEmps,
                  deptId: Number((targetPartner && targetPartner.Code) ?? t.deptId),
                  partnerId: Number((targetPartner && targetPartner.Partner) ?? t.partnerId),
                  blockId: Number((targetBlock && targetBlock.Id) ?? t.blockId),
                  blockDepName: String((targetBlock && targetBlock.SubName) || t.blockDepName || ''),
                }
              : t
          );
          const updatedActive =
            updatedTickets.find((t) => Number(t.supId) === Number(targetSupId)) ||
            state.deploySummary.ticket;
          state.deploySummary = {
            ...state.deploySummary,
            tickets: updatedTickets,
            ticket: updatedActive,
          };
        }

        state.deployReassignEmpCode = '';
        state.deployReassignReasonId = '';
        state.deployReassignSearch = '';
        if (empRefreshWarn) {
          state.deployNotice = `${res.message} (Lưu ý đồng bộ lại KTV: ${empRefreshWarn})`;
        }
      },
    });
  }

  async function loadRecallModal(
    rawContractId = state.contractInput,
    { clearNotice = false, forceReload = false } = {}
  ) {
    if (forceReload) {
      if (recallStaffSearchTimer) {
        clearTimeout(recallStaffSearchTimer);
        recallStaffSearchTimer = null;
      }
      state.recallStaffEdit = null;
    }
    state.recallLoading = true;
    state.recallProgress = 'Đang đọc danh sách vật tư thu hồi…';
    state.recallError = '';
    state.recallLoginUrl = '';
    if (clearNotice) {
      state.recallNotice = '';
      state.recallNoticeTone = 'info';
    }
    renderConfirm();

    const cleanId = normalizeContractId(rawContractId || '');
    try {
      const res = await loadRecallTicketContext(cleanId, {
        pageDocument,
        pageLocation: pageWindow ? pageWindow.location : null,
        forceReload,
        onProgress: (msg) => {
          if (!state.confirmAction || state.confirmAction.id !== 'manage_recall') return;
          if (msg && msg !== state.recallProgress) {
            state.recallProgress = msg;
            renderConfirm();
          }
        },
      });
      if (!state.confirmAction || state.confirmAction.id !== 'manage_recall') {
        return;
      }
      state.recallLoading = false;
      state.recallProgress = '';
      state.recallStatus = res.status || 'needs_recall_page';
      state.recallMode = res.mode || 'live';
      state.recallSnapshot = res.snapshot || null;
      state.recallContractMismatch = Boolean(res.contractMismatch);
      if (res.status === 'error') {
        state.recallError = res.message || 'Không đọc được dữ liệu phiếu thu hồi.';
      } else if (res.status === 'iam_expired') {
        state.recallLoginUrl = res.loginUrl || RECALL_ENDPOINTS.base;
        state.recallNotice =
          res.message ||
          'Phiên đăng nhập IAM trên NextGen Vật tư đã hết hạn. Bấm "Đăng nhập IAM" rồi thử lại.';
        state.recallNoticeTone = 'warn';
      } else if (res.status === 'needs_contract_android') {
        state.recallNotice =
          res.message ||
          'Vui lòng nhập Mã hợp đồng ở màn hình chính trước khi mở Phiếu thu hồi vật tư.';
        state.recallNoticeTone = 'warn';
      } else if (res.status === 'ok' && res.snapshot && res.snapshot.contract && !state.contractInput) {
        state.contractInput = res.snapshot.contract;
        setState(STORAGE_KEYS.LAST_CONTRACT, res.snapshot.contract);
        renderMain();
      }
    } catch (err) {
      if (!state.confirmAction || state.confirmAction.id !== 'manage_recall') {
        return;
      }
      state.recallLoading = false;
      state.recallProgress = '';
      state.recallError = err && err.message ? err.message : 'Lỗi đọc dữ liệu phiếu thu hồi.';
    }
    renderConfirm();
  }

  function renderRecallStaffOptionsIntoHost(hostEl, edit) {
    if (!hostEl) return;
    while (hostEl.firstChild) {
      hostEl.removeChild(hostEl.firstChild);
    }
    if (!edit) return;
    if (edit.searching) {
      hostEl.appendChild(
        el('div', { className: 'ri-field-hint', text: 'Đang lọc danh sách KTV từ NextGen…' })
      );
      return;
    }
    const opts = Array.isArray(edit.options) ? edit.options : [];
    if (opts.length === 0) {
      hostEl.appendChild(
        el('div', {
          className: 'ri-field-hint',
          text: edit.searchQuery
            ? `Không thấy tên KTV khớp "${edit.searchQuery}". Hãy thử từ khóa khác hoặc bấm Tìm KTV.`
            : 'Chưa tải được danh sách KTV. Hãy gõ vài ký tự rồi bấm Tìm KTV.',
        })
      );
      return;
    }
    for (const staffName of opts) {
      const isSelected =
        String(edit.selectedStaff || '').trim().toLowerCase() ===
        String(staffName).trim().toLowerCase();
      hostEl.appendChild(
        el(
          'button',
          {
            type: 'button',
            className: `ri-reassign-emp-btn${isSelected ? ' is-selected' : ''}`,
            disabled: edit.submitting,
            onClick: () => {
              if (!state.recallStaffEdit) return;
              state.recallStaffEdit.selectedStaff = staffName;
              state.recallStaffEdit.armed = false;
              state.recallStaffEdit.error = '';
              renderConfirm();
            },
          },
          [
            el('span', { className: 'ri-reassign-emp-title', text: staffName }),
            isSelected
              ? el('span', { className: 'ri-reassign-emp-meta', text: 'Đang chọn để cập nhật' })
              : null,
          ]
        )
      );
    }
  }

    if (!item) return;
    if (recallStaffSearchTimer) {
      clearTimeout(recallStaffSearchTimer);
      recallStaffSearchTimer = null;
    }
    const isDemo = state.recallMode === 'demo';
    state.recallArmedCreate = false;
    state.recallNotice = '';
    state.recallStaffEdit = {
      rowIndex: item.rowIndex,
      itemName: item.name,
      loading: true,
      searching: false,
      submitting: false,
      armed: false,
      error: '',
      dialogStillOpen: false,
      dialog: null,
      searchQuery: state.recallLastStaff || '',
      options: [],
      selectedStaff: '',
    };
    renderConfirm();

    try {
      const res = await openRecallStaffEditor(
        {
          rowIndex: item.rowIndex,
          itemName: item.name,
          currentCollector: item.collector || '',
        },
        {
          pageDocument,
          pageLocation: pageWindow ? pageWindow.location : null,
          forceDemo: isDemo,
        }
      );

        !state.confirmAction ||
