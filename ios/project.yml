name: RemoteInside
options:
  bundleIdPrefix: com.remoteinside
  deploymentTarget:
    iOS: "15.0"
targets:
  RemoteInside:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: RemoteInside/Sources
      - path: RemoteInside/Assets.xcassets
      - path: RemoteInside/Resources/remote-inside.html
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: RemoteInside/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.remoteinside.app
        PRODUCT_NAME: RemoteInside
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.17.0"
        CURRENT_PROJECT_VERSION: "1700"
